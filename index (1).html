<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Log</title>
<meta name="theme-color" content="#15120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quest Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #15120f;
  --panel: #1d1811;
  --panel-border: #3a2f22;
  --text: #ede3d0;
  --text-dim: #9c917e;
  --blood: #a82f2a;
  --blood-bright: #d64d43;
  --gold: #c9a227;
  --arcane: #6b4e9e;
  --heal: #4c7a5c;
  --minion: #6e7b8c;
  --elite: #b8862b;
  --vanguard: #c9622a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body {
  color: var(--text);
  font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
}
.ql-root { padding: 20px 16px 60px; max-width: 640px; margin: 0 auto; position: relative; }

.hud { background: linear-gradient(180deg, #221c14, #1a1510); border: 1px solid var(--panel-border); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
.page-nav { display: flex; gap: 6px; margin-bottom: 18px; }
.nav-btn { flex: 1; background: #17130e; color: var(--text-dim); border: 1px solid var(--panel-border); border-radius: 8px; padding: 9px; font-family: inherit; font-size: 13px; cursor: pointer; }
.nav-btn:hover { color: var(--text); }
.nav-btn-active { background: var(--gold); color: #1a1510; font-weight: 600; border-color: var(--gold); }
.hud-top { display: flex; align-items: center; gap: 14px; }
.level-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #3a2f1a, #1a1510); border: 2px solid var(--gold); flex-shrink: 0; }
.level-num { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 20px; font-weight: 700; color: var(--gold); line-height: 1; }
.level-label { font-size: 9px; letter-spacing: 0.08em; color: var(--text-dim); text-transform: uppercase; }
.bars { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { display: flex; align-items: center; gap: 4px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; width: 34px; flex-shrink: 0; }
.hp-label { color: var(--blood-bright); }
.xp-label { color: var(--gold); }
.bar-track { position: relative; flex: 1; height: 18px; border-radius: 4px; background: #0f0c09; border: 1px solid var(--panel-border); overflow: hidden; }
.bar-fill { height: 100%; transition: width 0.4s ease; }
.hp-fill { background: linear-gradient(90deg, var(--blood), var(--blood-bright)); }
.xp-fill { background: linear-gradient(90deg, #7a5f10, var(--gold)); }
.bar-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace; font-size: 10px; color: var(--text); text-shadow: 0 1px 2px #000; }
.path-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--panel-border); width: fit-content; }

.panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.panel-head h2 { font-size: 15px; margin: 0; letter-spacing: 0.03em; color: var(--text); }
.panel-sub { font-size: 11px; color: var(--text-dim); }

.char-stats { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
.flurry-banner { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #1a1510; background: linear-gradient(90deg, var(--gold), #e0b84a); padding: 7px 12px; border-radius: 8px; margin-bottom: 10px; }
.forecast-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-size: 12px; color: var(--text-dim); margin-bottom: 14px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; }
.forecast-info-btn { margin-left: auto; padding: 2px; color: var(--text-dim); }
.forecast-info-btn:hover { color: var(--gold); }
.forecast-detail { display: flex; flex-wrap: wrap; gap: 16px; margin: -6px 0 14px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; }
.forecast-detail-col { flex: 1 1 200px; min-width: 180px; }
.forecast-detail-col-small { flex: 0 1 120px; min-width: 110px; }
.forecast-detail-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.forecast-detail-line { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 3px; font-size: 12px; }
.forecast-detail-dim { color: var(--text-dim); font-style: italic; }
.forecast-detail-num { font-family: ui-monospace, monospace; color: var(--blood-bright); }
.forecast-detail-good { color: var(--heal); }
.forecast-detail-total { border-top: 1px solid var(--panel-border); margin-top: 4px; padding-top: 4px; font-weight: 600; color: var(--text); }
.forecast-detail-total .forecast-detail-num { color: var(--text); }

.class-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.class-choice-card { border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px; background: #17130e; display: flex; flex-direction: column; gap: 8px; }
.class-choice-name { font-size: 14px; font-weight: 700; color: var(--gold); }
.class-ability-option { border-top: 1px solid var(--panel-border); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.class-ability-option:first-of-type { border-top: none; padding-top: 0; }
.class-ability-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
@media (max-width: 520px) { .class-choice-grid { grid-template-columns: 1fr; } }
.contrib-year-bar { display: flex; gap: 6px; margin-bottom: 10px; }
.contrib-year-btn { background: #17130e; color: var(--text-dim); border: 1px solid var(--panel-border); border-radius: 6px; padding: 5px 12px; font-family: inherit; font-size: 12px; cursor: pointer; }
.contrib-year-btn:hover { color: var(--text); }
.contrib-year-active { background: var(--gold); color: #1a1510; font-weight: 600; border-color: var(--gold); }
.contrib-cell-pad { background: transparent; cursor: default; }
.contrib-scroll { overflow-x: auto; padding-bottom: 4px; }
.contrib-inner { display: inline-flex; flex-direction: column; gap: 4px; min-width: 100%; }
.contrib-months { display: flex; gap: 3px; padding-left: 22px; font-size: 10px; color: var(--text-dim); }
.contrib-month-label { width: 11px; flex-shrink: 0; }
.contrib-body { display: flex; gap: 4px; }
.contrib-daylabels { display: flex; flex-direction: column; gap: 3px; font-size: 9px; color: var(--text-dim); width: 18px; flex-shrink: 0; }
.contrib-daylabels span { height: 11px; line-height: 11px; }
.contrib-grid { display: flex; gap: 3px; }
.contrib-week { display: flex; flex-direction: column; gap: 3px; }
.contrib-cell { width: 11px; height: 11px; border-radius: 2px; background: #21201c; cursor: pointer; }
.contrib-cell:hover { outline: 1px solid var(--gold); }
.contrib-cell-selected { outline: 2px solid var(--gold); }
.contrib-death { position: relative; box-shadow: inset 0 0 0 1.5px #c0392b; }
.contrib-death::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #e74c3c; }
.contrib-legend-death { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; }
.hud-overdue { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 12px; color: var(--text-dim); }
.hud-overdue-active { color: var(--blood-bright, #e74c3c); }
.contrib-level-0 { background: #21201c; }
.contrib-level-1 { background: #1c3a26; }
.contrib-level-2 { background: #2c6b3f; }
.contrib-level-3 { background: #3d9a56; }
.contrib-level-4 { background: #56d47a; }
.contrib-legend { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-dim); margin-top: 8px; justify-content: flex-end; }
.contrib-legend .contrib-cell { cursor: default; width: 10px; height: 10px; }
.contrib-detail { margin-top: 12px; padding: 10px 12px; background: #17130e; border: 1px solid var(--panel-border); border-radius: 8px; }
.contrib-detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.contrib-detail-date { font-size: 12px; font-weight: 600; color: var(--gold); }
.forecast-stat { display: flex; align-items: center; gap: 5px; }
.forecast-stat b { color: var(--text); font-weight: 600; }
.forecast-damage b { color: var(--blood-bright); }
.forecast-heal b { color: var(--heal); }
.char-stat { display: flex; align-items: center; gap: 5px; }
.char-stat b { color: var(--text); font-weight: 600; }

.training-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.session-count { font-family: ui-monospace, monospace; font-size: 13px; color: var(--text-dim); }

.new-task-form { display: flex; flex-direction: column; gap: 8px; }
.new-task-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.input { background: #0f0c09; border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text); padding: 8px 10px; font-family: inherit; font-size: 13px; }
.input-full { width: 100%; }
.input-date { flex: 1 1 130px; }
.input-tier { flex: 1 1 90px; }
.input-project { flex: 1 1 130px; }
.new-task-row .btn-add { flex: 0 0 auto; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-family: inherit; cursor: pointer; transition: filter 0.15s ease, transform 0.1s ease; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:hover { filter: brightness(1.1); }
.btn-session { background: var(--heal); color: #eafff0; }
.btn-add { background: var(--gold); color: #1a1510; font-weight: 600; }
.btn-complete { background: #2a2318; color: var(--gold); border: 1px solid var(--gold); }
.btn-icon { background: transparent; color: var(--text-dim); padding: 6px; }
.btn-icon:hover { color: var(--blood-bright); }
.btn-endday { background: linear-gradient(90deg, #2a2148, var(--arcane)); color: #f1ecff; width: 100%; justify-content: center; padding: 12px; font-size: 14px; }
.btn-close { background: var(--gold); color: #1a1510; width: 100%; justify-content: center; margin-top: 10px; }

.empty { color: var(--text-dim); font-size: 13px; font-style: italic; }
.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--panel-border); background: #17130e; }
.task-item.tier-boss { border-color: var(--arcane); box-shadow: 0 0 0 1px rgba(107,78,158,0.25) inset; }
.task-item.overdue { border-color: var(--blood); }
.task-item.done { opacity: 0.5; }
.task-item.shielded { border-color: #3d6a8a; box-shadow: 0 0 0 1px rgba(111,163,201,0.2) inset; }
.task-icon { flex-shrink: 0; }
.task-body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.task-title { font-size: 13.5px; }
.task-item.done .task-title { text-decoration: line-through; }
.task-meta { font-size: 10.5px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dmg-badge { display: inline-flex; align-items: center; gap: 3px; color: var(--blood-bright); }
.done-badge { color: var(--heal); }
.shield-badge { display: inline-flex; align-items: center; gap: 3px; color: #6fa3c9; }
.weekly-boss-badge { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); }
.zone-boss-badge { display: inline-flex; align-items: center; gap: 3px; color: var(--vanguard); }
.task-item.zone-boss { border-color: var(--vanguard); box-shadow: 0 0 0 1px rgba(201,98,42,0.25) inset; }
.task-item.flagged { border-color: var(--gold); }
.btn-flag { color: var(--text-dim); background: none; }
.btn-flag:hover { color: var(--gold); }
.btn-flag-active { color: var(--gold); }

.week-status { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
.week-stat { display: inline-flex; align-items: center; gap: 5px; }
.btn-newweek { background: linear-gradient(90deg, #4a3a10, var(--gold)); color: #1a1510; font-weight: 600; width: 100%; justify-content: center; padding: 10px; }
.week-note { font-size: 10.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.4; }

.road-steps { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.road-step { width: 18px; height: 18px; border-radius: 50%; background: #0f0c09; border: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: center; color: var(--blood-bright); flex-shrink: 0; }
.road-step.passed { background: linear-gradient(135deg, #7a5f10, var(--gold)); border-color: var(--gold); }
.road-step.current { box-shadow: 0 0 0 2px var(--gold); }
.road-step.boss-step { width: 22px; height: 22px; border-color: var(--blood); background: rgba(168,47,42,0.15); }
.road-step.boss-step.passed { background: linear-gradient(135deg, var(--blood), var(--blood-bright)); border-color: var(--blood-bright); }
.road-story { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin: 0; }
.road-progress { font-size: 11.5px; color: var(--gold); margin-bottom: 6px; }
.enemy-hp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.enemy-hp-label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); width: 72px; flex-shrink: 0; }
.enemy-hp-track { height: 16px; }
.enemy-hp-fill { background: linear-gradient(90deg, #4a2a5e, var(--arcane)); }
.enemy-choice-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.enemy-choice-btn { flex: 1 1 140px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; background: #17130e; border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-family: inherit; text-align: left; }
.enemy-choice-btn:hover { border-color: var(--arcane); }
.enemy-choice-name { font-size: 13px; font-weight: 600; color: var(--text); }
.enemy-choice-drops { font-size: 10.5px; color: var(--text-dim); }

.subzone-map { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.subzone-chip { flex: 1 1 auto; padding: 5px 9px; border-radius: 20px; font-size: 10.5px; text-align: center; border: 1px solid var(--panel-border); background: #17130e; color: var(--text-dim); }
.subzone-chip.sz-locked { opacity: 0.45; font-style: italic; }
.subzone-chip.sz-unlocked { color: var(--text); }
.subzone-chip.sz-current { background: var(--gold); color: #1a1510; font-weight: 600; border-color: var(--gold); }
.subzone-chip.sz-cleared { color: var(--heal); border-color: var(--heal); }

.choice-buttons { display: flex; flex-direction: column; gap: 8px; }
.choice-btn { display: flex; flex-direction: column; gap: 3px; background: #17130e; border: 1px solid var(--panel-border); border-radius: 8px; padding: 11px 13px; cursor: pointer; font-family: inherit; text-align: left; }
.choice-btn:hover { border-color: var(--gold); }
.choice-btn-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text); }
.choice-btn-sub { font-size: 11px; color: var(--text-dim); }
.town-screen { text-align: center; padding: 10px 0; }
.shop-panel { text-align: left; background: #17130e; border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px 14px; margin: 14px 0; }
.shop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.shop-head h3 { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 0; color: var(--gold); }
.shop-gold { display: inline-flex; align-items: center; gap: 4px; font-family: ui-monospace, monospace; font-size: 13px; color: var(--gold); }
.shop-rep { display: inline-flex; align-items: center; gap: 4px; font-family: ui-monospace, monospace; font-size: 13px; color: #6fa3c9; }
.rep-locked { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #b06a6a; font-style: italic; }
.shop-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 12px 0 6px; }
.shop-section-label:first-of-type { margin-top: 10px; }
.shop-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.bulletin-panel { margin-bottom: 10px; }
.bulletin-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.bulletin-item { padding: 9px 10px; border-radius: 7px; border: 1px solid var(--panel-border); background: var(--bg); }
.bulletin-item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bulletin-item-title { font-size: 13px; font-weight: 600; color: var(--text); }
.bulletin-item-req { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); font-family: ui-monospace, monospace; }
.bulletin-item-req.bulletin-req-met { color: var(--heal); font-weight: 600; }
.bulletin-item-flavor { font-size: 11.5px; color: var(--text-dim); margin: 4px 0 8px; line-height: 1.4; }
.bulletin-item-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bulletin-item-reward { font-size: 10.5px; color: var(--gold); }
.btn-turnin { background: var(--gold); color: #1a1510; font-weight: 600; padding: 5px 10px; font-size: 12px; }
.btn-accept { background: var(--vanguard); color: #1a1510; font-weight: 600; padding: 5px 10px; font-size: 12px; }
.bulletin-item-done { opacity: 0.6; }
.active-quest-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.active-quest-item { padding: 9px 10px; border-radius: 7px; border: 1px solid var(--panel-border); background: #17130e; }
.active-quest-due { font-size: 11px; color: var(--text-dim); }
.recipe-ingredients { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.retreat-row { text-align: center; margin: 4px 0 10px; }
.shop-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--panel-border); background: var(--bg); }
.shop-item-stacked { flex-direction: column; align-items: stretch; gap: 4px; }
.shop-item-row { display: flex; align-items: center; gap: 8px; }
.shop-item-desc { margin: 0; font-size: 11px; color: var(--text-dim); line-height: 1.4; padding-left: 24px; }
.inn-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.inn-desc { display: flex; flex-direction: column; gap: 2px; }
.inn-desc-title { font-size: 13px; color: var(--text); }
.inn-desc-sub { font-size: 11px; color: var(--text-dim); }
.btn-buy { background: var(--gold); color: #1a1510; font-weight: 600; padding: 5px 10px; font-size: 12px; }
.btn-sell { background: #2a2318; color: var(--gold); border: 1px solid var(--gold); padding: 5px 10px; font-size: 12px; }
.btn-leave-town { background: var(--gold); color: #1a1510; font-weight: 600; margin-top: 10px; }
.inventory-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.inventory-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--panel-border); background: #17130e; }
.inventory-item-stacked { flex-direction: column; align-items: stretch; gap: 4px; }
.inventory-item-row { display: flex; align-items: center; gap: 8px; }
.inv-name { flex: 1; font-size: 13px; }
.inv-count { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-dim); }
.inv-price { display: inline-flex; align-items: center; gap: 3px; font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--gold); }
.btn-use { background: var(--gold); color: #1a1510; font-weight: 600; padding: 6px 10px; }
.inv-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 12px 0 6px; }
.inv-section-label:first-child { margin-top: 0; }
.inv-section-note { text-transform: none; letter-spacing: normal; font-style: italic; opacity: 0.7; margin-left: 4px; }
.phoenix-note { font-size: 11px; color: var(--text-dim); margin: 10px 0 0; }

.project-flag-btn { display: inline-flex; align-items: center; gap: 3px; background: transparent; border: none; font-family: inherit; font-size: 10.5px; padding: 0; cursor: pointer; }
.filtered-count { font-size: 11px; color: var(--gold); margin: -6px 0 10px; }
.quest-controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.filter-dropdown { position: relative; }
.filter-dropdown-trigger { display: inline-flex; align-items: center; gap: 6px; background: #17130e; color: var(--text-dim); border: 1px solid var(--panel-border); border-radius: 7px; padding: 6px 10px; font-family: inherit; font-size: 12px; cursor: pointer; }
.filter-dropdown-trigger:hover { color: var(--text); }
.filter-dropdown-trigger .chevron { font-size: 10px; }

<script>
// ---------- Icons (tiny hand-rolled SVGs, no dependencies) ----------

    skull: '<path d="M12 3.5c-4.4 0-7.5 3.1-7.5 7 0 2.6 1.3 4.4 2.7 5.6v2.4c0 .6.5 1 1 1h1.3v-1.8h1v1.8h2v-1.8h1v1.8h1.3c.5 0 1-.4 1-1v-2.4c1.4-1.2 2.7-3 2.7-5.6 0-3.9-3.1-7-7.5-7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9" cy="11" r="1.3" fill="currentColor"/><circle cx="15" cy="11" r="1.3" fill="currentColor"/>',
    gift: '<path d="M4 8h16v4H4zM4 12h16v8H4zM12 8v12M12 8c-1.5-3-5-3-5-.5S9.5 8 12 8zM12 8c1.5-3 5-3 5-.5S14.5 8 12 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
    bow: '<path d="M6 3c4 3 4 15 0 18M6 3l-1.5 1.5M6 21l-1.5-1.5M6 12h14l-4-3m4 3l-4 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',

}

// ---------- Constants ----------
const TIERS = {
  minion: { label: "Minor", dmg: 2, color: "var(--minion)", icon: "sword" },
  elite:  { label: "Major", dmg: 5, color: "var(--elite)", icon: "flame" },
  boss:   { label: "Master", dmg: 15, color: "var(--arcane)", icon: "crown" },
};
// Class system: pick a class at level 5 (permanent), plus one starting
// ability. The other ability for your class unlocks automatically at level
// 10. cooldownDays is checked in calendar days (1 = once per day, 2 = every
// other day) — edit these numbers directly to retune pacing.
const EVASIVE_DODGE_CHANCE = 0.5; // Hunter's Evasive Maneuver: chance to dodge ALL of a night's damage
const CLASSES = {
  mage: {
    name: "Mage",
    abilities: {
      fireball: { id: "fireball", name: "Fireball", desc: "Instantly deal 20 damage to your current enemy.", cooldownDays: 1 },
      heal: { id: "heal", name: "Heal", desc: "Restore 15 HP.", cooldownDays: 2 },
    },
  },
  fighter: {
    name: "Fighter",
    abilities: {
      flurry: { id: "flurry", name: "Flurry", desc: "Your next 3 tasks deal double damage.", cooldownDays: 1 },
      defensive_stance: { id: "defensive_stance", name: "Defensive Stance", desc: "Reduce tonight's incoming damage by 10 (20 if a shield is equipped).", cooldownDays: 2 },
    },
  },
  hunter: {
    name: "Hunter",
    abilities: {
      aimed_shot: { id: "aimed_shot", name: "Aimed Shot", desc: "Instantly deal 16 damage to your current enemy.", cooldownDays: 1 },
      evasive_maneuver: { id: "evasive_maneuver", name: "Evasive Maneuver", desc: `A gamble, not a guarantee: ${Math.round(EVASIVE_DODGE_CHANCE*100)}% chance to dodge ALL of tonight's damage entirely.`, cooldownDays: 2 },
    },
  },
};
// Companions — a separate axis from Class/Profession. Each has an ability
// usable once per day-resolve (same cooldown pattern as class abilities).
// Taming is material-based and restricted to Hunters for now (huntersOnly);
// a future non-Hunter acquisition path — recruitable characters — can add
// entries here too without `huntersOnly`, reusing this same ability/cooldown
// plumbing (state.player.companion / knownCompanions) unchanged.
const COMPANIONS = {
  wolf: {
    id: "wolf", name: "Wolf", icon: "sword", huntersOnly: true,
    tameMaterial: { fang: 3, pelt: 2 },
    ability: { id: "rend", name: "Rend", desc: "Your next 2 tasks deal double damage.", cooldownDays: 1 },
  },
  hawk: {
    id: "hawk", name: "Hawk", icon: "sparkle", huntersOnly: true,
    tameMaterial: { feather: 3, talon: 2 },
    ability: { id: "swoop", name: "Swoop", desc: "Instantly deal 12 damage to your current enemy.", cooldownDays: 1 },
  },
};
// Guild spells — taught by the Forest City's Guild Halls, per class. Unlocked
// by finishing the matching GUILD_QUESTS chain, then stored in
// state.player.unlockedAbilities alongside the class's base abilities.
const GUILD_SPELLS = {
  mage: {
    chain_lightning: { id: "chain_lightning", name: "Chain Lightning", desc: "Instantly deal 32 damage to your current enemy.", cooldownDays: 3, effect: "damage", amount: 32, icon: "sparkle" },
    greater_heal: { id: "greater_heal", name: "Greater Heal", desc: "Restore 35 HP.", cooldownDays: 3, effect: "heal", amount: 35, icon: "heart" },
  },
  fighter: {
    cleave: { id: "cleave", name: "Cleave", desc: "Instantly deal 26 damage to your current enemy.", cooldownDays: 2, effect: "damage", amount: 26, icon: "sword" },
    rally: { id: "rally", name: "Rally", desc: "Restore 25 HP.", cooldownDays: 3, effect: "heal", amount: 25, icon: "shieldcheck" },
  },
  hunter: {
    piercing_shot: { id: "piercing_shot", name: "Piercing Shot", desc: "Instantly deal 30 damage to your current enemy.", cooldownDays: 3, effect: "damage", amount: 30, icon: "bow" },
    hunters_mark: { id: "hunters_mark", name: "Hunter's Mark", desc: "Your next 5 tasks deal double damage.", cooldownDays: 3, effect: "mark", amount: 5, icon: "bow" },
  },
};
function guildSpellDef(id) {
  for (const cls of Object.values(GUILD_SPELLS)) if (cls[id]) return cls[id];
  return null;
}
function companionForAbility(id) {
  return Object.values(COMPANIONS).find(c => c.ability.id === id) || null;
}
function abilityDef(id) {
  for (const cls of Object.values(CLASSES)) {
    if (cls.abilities[id]) return cls.abilities[id];
  }
  const comp = companionForAbility(id);
  if (comp) return comp.ability;
  return guildSpellDef(id);
}
function classDmgBonus(level, classId) {
  if (classId !== "mage" || level < 5) return 0;
  return 2 * (1 + Math.floor((level - 5) / 2));
}
// Hunter passive — Opening Volley: a flat bonus on the FIRST hit against a
// freshly spawned enemy (checked by the caller via enemyHp === enemyMaxHp).
// Doesn't scale with level; it's a per-encounter bonus, not a per-task one,
// so it isn't comparable to classDmgBonus's flat per-task number.
const OPENING_VOLLEY_BONUS = 5;
function openingVolleyBonus(classId, isFreshEnemy) {
  if (classId !== "hunter" || !isFreshEnemy) return 0;
  return OPENING_VOLLEY_BONUS;
}
const STORAGE_KEY = "quest-log-save-v2";

// part of the save file, exports, or what gets uploaded to the Gist.
const SYNC_KEY = "quest-log-sync-v1";
const SYNC_FILE = "quest-log-save.json";
function loadSyncCfg() {
  const blank = { token: "", gistId: "", lastSynced: 0, dirty: false, lastAt: 0 };
  try {
    const c = JSON.parse(localStorage.getItem(SYNC_KEY) || "null");
    return c && typeof c === "object" ? { ...blank, ...c } : blank;
  } catch (e) { return blank; }

let syncCfg = loadSyncCfg();
function saveSyncCfg() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); } catch (e) {} }
let syncStatus = { busy: false, ok: true, text: "" };
let syncPushTimer = null;

function ensureProjectColor(name) {
  if (!name || state.projectColors[name]) return;
  const used = new Set(Object.values(state.projectColors));
  const unused = PROJECT_PALETTE.filter(c => !used.has(c));
  state.projectColors[name] = unused.length > 0
    ? unused[Math.floor(Math.random() * unused.length)]
    : PROJECT_PALETTE[Object.keys(state.projectColors).length % PROJECT_PALETTE.length];
}
function colorForProject(name) {
  if (!name) return "var(--text-dim)";
  ensureProjectColor(name);
  return state.projectColors[name];
}

// Retroactively fixes an already-spawned enemy that was HP-scaled by the old
// bug (farm-lap final steps incorrectly getting boss-tier HP). Preserves the
// absolute damage already dealt, just against the correctly-sized max.
function fixBuggedFarmLapEnemy(sz, zoneNumber) {
  if (!sz.currentEnemyKey || sz.enemyMaxHp == null) return;
  const isBossStep = isFirstRun(sz) && (sz.stepsCleared + 1 === loopSize(sz));
  const correctMax = enemyHpForStep(zoneNumber, isBossStep, sz.currentEnemyKey);
  if (correctMax !== sz.enemyMaxHp) {
    const damageDealt = Math.max(0, sz.enemyMaxHp - sz.enemyHp);
    sz.enemyMaxHp = correctMax;
    sz.enemyHp = Math.max(1, correctMax - damageDealt);
  }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // Note: dailySessions is intentionally NOT reset here just because the
    // calendar date changed — it only resets when endDay() actually processes
    // it, so effort logged before a weekend (or any day End Day doesn't run)
    // isn't silently discarded before it's counted.
    if (!parsed.dailySessions || typeof parsed.dailySessions.sessions !== "number") {
      parsed.dailySessions = { date: todayStr(), sessions: 0 };
    }
    parsed.player = migratePlayer(parsed.player);
    parsed.week = migrateWeek(parsed.week || {});
    parsed.region = migrateRegion(parsed.region, parsed.player, parsed.road, parsed.map);
    delete parsed.road;
    delete parsed.map;
    Object.entries(parsed.region.subzones).forEach(([id, sz]) => fixBuggedFarmLapEnemy(sz, subzoneZoneNum(id)));
    parsed.inventory = migrateInventory(parsed.inventory);
    migratePhoenixCharges(parsed.player, parsed.inventory);
    if (!Array.isArray(parsed.sessionLog)) parsed.sessionLog = [];
    if (typeof parsed.lastProject !== "string") parsed.lastProject = "";
    if (!parsed.projectColors || typeof parsed.projectColors !== "object") parsed.projectColors = {};
    if (!Array.isArray(parsed.completedOneTimeQuests)) parsed.completedOneTimeQuests = [];
    if (!Array.isArray(parsed.habits)) parsed.habits = [];
    if (!Array.isArray(parsed.slipLog)) parsed.slipLog = [];
    if (!parsed.habitStats || typeof parsed.habitStats.streak !== "number") parsed.habitStats = { streak: 0, best: 0 };
    if (!parsed.settings || typeof parsed.settings !== "object") parsed.settings = {};
    if (!DIFFICULTY_BASE_HP[parsed.settings.difficulty]) parsed.settings.difficulty = "easy";
    if (typeof parsed.settings.archiveCompleted !== "boolean") parsed.settings.archiveCompleted = true;
    if (typeof parsed.settings.autoEndDay !== "boolean") parsed.settings.autoEndDay = true;
    if (!Array.isArray(parsed.goals)) parsed.goals = [];
    if (!Array.isArray(parsed.restDays)) parsed.restDays = [];
    if (!Array.isArray(parsed.customQuests)) parsed.customQuests = [];
    // Repair any task whose due date got lost (e.g. a cleared date field) —
    // an unparseable dueDate breaks the quest-list sort for the WHOLE list,
    // not just that task, so heal it here rather than let it linger.
    if (Array.isArray(parsed.tasks)) {
      parsed.tasks.forEach(t => {
        if (!t.completed && isNaN(Date.parse(t.dueDate))) t.dueDate = todayStr();
      });
    }
    return parsed;
  } catch (e) {
    console.error("Load failed, starting fresh", e);
    return defaultState();
  }
}

function applyXp(player, amount) {
  let { level, xp, maxHp, hp, lifetimeXp } = player;
  xp += amount;
  lifetimeXp = (lifetimeXp || 0) + amount;
  let leveledUp = false;
  while (xp >= xpToLevel(level)) {
    xp -= xpToLevel(level);
    level += 1;
    maxHp = maxHpForLevel(level);
    hp = maxHp;
    leveledUp = true;
  }
  const updated = { ...player, level, xp, maxHp, hp: leveledUp ? hp : Math.min(hp, maxHp), lifetimeXp };
  if (updated.level >= 10 && updated.classId && updated.unlockedAbilities && CLASSES[updated.classId] && updated.unlockedAbilities.filter(id => CLASSES[updated.classId].abilities[id]).length === 1) {
    const cls = CLASSES[updated.classId];
    const secondAbility = cls ? Object.keys(cls.abilities).find(id => !updated.unlockedAbilities.includes(id)) : null;
    if (secondAbility) updated.unlockedAbilities = [...updated.unlockedAbilities, secondAbility];
  }
  return updated;
}

function completeTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || task.completed) return;
  const today = todayStr();
  task.completed = true;
  task.completedDate = today;

  // Weekly boss is a separate, unrelated-to-enemies system: flagging one real
  // task per week for an instant bonus. Stays immediate, not tied to kills.
  if (task.id === state.week.weeklyBossTaskId) {
    state.player.hp = Math.min(state.player.hp + 10, state.player.maxHp);
    state.player = applyXp(state.player, 10);
    state.week.shieldsUsed = 0;
    pushToast(`${ic("shieldalert", 14)} Weekly boss defeated — shields fully refreshed!`, "loot");
  }

  const zoneNum = currentZoneNumber();
  const szBefore = currentSubzoneState();
  const wasBossStep = isFirstRun(szBefore) && (szBefore.stepsCleared + 1 === loopSize(szBefore));
  const subzoneIdForLoot = state.region.currentSubzone;

  const damageResult = dealRoadDamage(task);

  if (damageResult.killed) {
    rollLoot(task, damageResult.enemyKey, zoneNum, wasBossStep, subzoneIdForLoot);
  }

  if (task.recurring) {
    const nextDue = addDaysToDateStr(today, recurringDays(task.recurring));
    state.tasks.push({ id: uid(), title: task.title, dueDate: nextDue, createdDate: todayStr(), tier: task.tier, completed: false, completedDate: null, shieldedUntil: null, project: task.project, recurring: task.recurring });
  }

  save(); render();
}

function turnInBulletinQuest(questId) {

// Removes up to n individual item units at random (weighted by how many of
// each you're carrying), used as the death penalty. Returns a map of what
// was lost, e.g. { potion_minor: 1, pelt: 1 }.
function loseRandomInventoryItems(n) {
  const pool = [];
  Object.keys(state.inventory).forEach(id => {
    const item = LOOT_TABLE.find(i => i.id === id);
    if (item && item.permanent) return;
    for (let i = 0; i < state.inventory[id]; i++) pool.push(id);
  });
  const lost = {};
  for (let i = 0; i < n && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    const id = pool.splice(idx, 1)[0];
    state.inventory[id] -= 1;
    lost[id] = (lost[id] || 0) + 1;
  }
  return lost;
}

function businessDaysSpan(startDate, endDate) {
  let count = 0;
  let d = new Date(startDate + "T00:00:00Z");
  const end = new Date(endDate + "T00:00:00Z");
  while (d <= end) {
    const day = d.getUTCDay();
    const dateStr = d.toISOString().slice(0, 10);
    if (day !== 0 && day !== 6 && !state.restDays.includes(dateStr)) count++;
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return count;
}

const CONTRIB_MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function contribLevel(total) {
  if (total <= 0) return 0;
  if (total === 1) return 1;
  if (total <= 3) return 2;
  if (total <= 5) return 3;
  return 4;
}
function contributionData(year) {
  const yearStart = new Date(Date.UTC(year, 0, 1));
  const yearEnd = new Date(Date.UTC(year, 11, 31));
  const gridStart = new Date(yearStart);
  gridStart.setUTCDate(gridStart.getUTCDate() - gridStart.getUTCDay()); // back up to the previous Sunday
  const gridEnd = new Date(yearEnd);
  gridEnd.setUTCDate(gridEnd.getUTCDate() + (6 - gridEnd.getUTCDay())); // forward to the next Saturday

  const days = [];
  let d = new Date(gridStart);
  while (d <= gridEnd) {
    const dateStr = d.toISOString().slice(0, 10);
    const inYear = d.getUTCFullYear() === year;
    if (inYear) {
      const tasks = state.tasks.filter(t => t.completed && t.completedDate === dateStr);
      const total = tasks.length;
      days.push({ date: dateStr, tasks, total, level: contribLevel(total), inYear: true, death: (state.player.deathDates || []).includes(dateStr) });
    } else {
      days.push({ date: dateStr, tasks: [], total: 0, level: -1, inYear: false });
    }
    d.setUTCDate(d.getUTCDate() + 1);
  }

  const weeks = [];
  for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

  const totalCount = days.filter(day => day.inYear).reduce((sum, day) => sum + day.total, 0);
  return { weeks, totalCount };
}
// ---------- Habits to discourage ("slips") ----------
// You list habits you want to do less of, each with a severity. Logging a
// slip heals your current enemy and adds unblockable damage to the night it
// belongs to. Repeats of the same habit on the same day cost more.
const HABIT_SEVERITY = {
  mild:     { label: "Mild",     heal: 4,  dmg: 2 },
  moderate: { label: "Moderate", heal: 8,  dmg: 4 },
  severe:   { label: "Severe",   heal: 14, dmg: 7 },
};
const SLIP_ESCALATION_STEP = 0.5; // each repeat that day adds +50% of base...
const SLIP_ESCALATION_CAP = 3;    // ...up to x3
const CLEAN_NIGHT_GOLD = 3;
const CLEAN_WEEK_BONUS_GOLD = 20; // every 7th clean night in a row
function slipMultiplier(habitId, date) {
  const n = state.slipLog.filter(x => x.habitId === habitId && x.date === date).length + 1;
  return Math.min(SLIP_ESCALATION_CAP, 1 + SLIP_ESCALATION_STEP * (n - 1));
}
function slipPreview(habitId) {
  const h = state.habits.find(x => x.id === habitId);
  if (!h || !HABIT_SEVERITY[h.severity]) return null;
  const sev = HABIT_SEVERITY[h.severity];
  const mult = slipMultiplier(habitId, todayStr());
  return { heal: Math.round(sev.heal * mult), dmg: Math.round(sev.dmg * mult), mult };
}
function addHabit(name, severity) {
  name = (name || "").trim();
  if (!name || !HABIT_SEVERITY[severity]) return;
  if (state.habits.some(h => h.name.toLowerCase() === name.toLowerCase())) return;
  state.habits.push({ id: uid(), name, severity, createdDate: todayStr() });
  save(); render();
}
function removeHabit(id) {
  state.habits = state.habits.filter(h => h.id !== id);
  save(); render();
}

function logSlip(habitId) {
  const habit = state.habits.find(h => h.id === habitId);
  if (!habit || !HABIT_SEVERITY[habit.severity]) return;
  const today = todayStr();
  const p = slipPreview(habitId);
  let dmg = p.dmg;
  let healed = 0;
  const sz = currentSubzoneState();
  const fighting = state.region.mode === "subzone" && sz.currentEnemyKey && sz.enemyHp > 0;
  if (fighting) {
    healed = Math.min(p.heal, Math.max(0, sz.enemyMaxHp - sz.enemyHp));
    sz.enemyHp += healed;
  }
  // Any healing that couldn't land (no enemy, or the enemy is already at full
  // health) is converted to half-rate unblockable damage so it's never free.
  const wasted = p.heal - healed;
  if (wasted > 0) dmg += Math.max(1, Math.round(wasted / 2));
  state.slipLog.push({ id: uid(), date: today, habitId, healed, dmg, subzone: state.region.currentSubzone, enemyKey: fighting ? sz.currentEnemyKey : null });
  pushToast(`${ic("skull", 14)} Slip logged: ${habit.name}. ${healed > 0 ? `${ENEMIES[sz.currentEnemyKey].name} regains ${healed} HP. ` : ""}+${dmg} damage tonight.`, "downed");
  save(); render();
}
function undoSlip(habitId) {
  const today = todayStr();
  const idx = state.slipLog.map((x, i) => (x.habitId === habitId && x.date === today) ? i : -1).filter(i => i >= 0).pop();
  if (idx === undefined) return;
  const entry = state.slipLog[idx];
  state.slipLog.splice(idx, 1);
  // Best-effort reversal of the heal if the same enemy is still being fought.
  const sz = state.region.subzones[entry.subzone];
  if (entry.healed > 0 && sz && sz.currentEnemyKey === entry.enemyKey && sz.enemyHp > entry.healed) sz.enemyHp -= entry.healed;
  save(); render();
}
function pendingSlipDamage() {
  const since = state.player.lastProcessedDate;
  return state.slipLog.filter(x => x.date > since && x.date <= todayStr()).reduce((sum, x) => sum + x.dmg, 0);
}
// Dual of the nightly report: tallies slips for one night and updates the
// clean-night streak. Returns { slips, slipDamage }.
function resolveSlips(date, prevLastProcessedDate, log) {
  const slips = state.slipLog.filter(x => x.date > prevLastProcessedDate && x.date <= date);
  const slipDamage = slips.reduce((sum, x) => sum + x.dmg, 0);
  if (slips.length > 0) {
    log.push({ type: "damage", text: `Slips (${slips.length}) — ${slipDamage} unblockable damage` });
  }
  const tracking = state.habits.some(h => h.createdDate <= date);
  if (tracking) {
    if (slips.length === 0) {
      state.habitStats.streak += 1;
      state.habitStats.best = Math.max(state.habitStats.best, state.habitStats.streak);
      let gold = CLEAN_NIGHT_GOLD;
      if (state.habitStats.streak % 7 === 0) gold += CLEAN_WEEK_BONUS_GOLD;
      state.player.gold = (state.player.gold || 0) + gold;
      log.push({ type: "heal", text: `Clean night (${state.habitStats.streak} in a row) — +${gold} gold` });
    } else {
      state.habitStats.streak = 0;
    }
  }
  return { slips, slipDamage };
}
// Unfinished quests that are overdue OR due today.
function dueCount() {
  const today = todayStr();
  return state.tasks.filter(t => !t.completed && t.dueDate && t.dueDate <= today).length;
}
function streakDaysBetween(aISO, bISO) {
  return Math.round((new Date(bISO + "T00:00:00Z") - new Date(aISO + "T00:00:00Z")) / 86400000);
}
// Death streak stats, based on the dated deaths recorded since tracking began.
// Deaths from before dates were recorded are counted in deathCount but have no
// date, so they can't contribute to a streak.
function deathStreakInfo() {
  const dates = Array.from(new Set(state.player.deathDates || [])).sort();
  const total = state.player.deathCount || 0;
  const undated = Math.max(0, total - dates.length);
  const today = todayStr();
  const activity = [...state.sessionLog.map(x => x.date), ...state.tasks.filter(t => t.completed && t.completedDate).map(t => t.completedDate)].sort();
  const start = activity[0] || today;
  let current = null, longest = null;
  if (dates.length > 0) {
    current = Math.max(0, streakDaysBetween(dates[dates.length - 1], today));
    const marks = [start, ...dates, today];
    longest = 0;
    for (let i = 1; i < marks.length; i++) {
      const gap = streakDaysBetween(marks[i - 1], marks[i]);
      // Between two deaths the death days themselves don't count; the first and last segments are measured from start / to today.
      longest = Math.max(longest, i === 1 || i === marks.length - 1 ? gap : gap - 1, 0);
    }
  } else if (total === 0) {
    current = Math.max(0, streakDaysBetween(start, today));
    longest = current;
  }
  return { dates, total, undated, current, longest };
}
function earliestActivityYear() {
  const dates = [
    ...state.tasks.filter(t => t.completed && t.completedDate).map(t => t.completedDate),
  ];
  const currentYear = new Date(todayStr() + "T00:00:00Z").getUTCFullYear();
  if (dates.length === 0) return currentYear;
  return Math.min(currentYear, parseInt(dates.slice().sort()[0].slice(0, 4), 10));
}
function weekMonthLabel(week) {

  if (!firstOfMonth) return null;
  return CONTRIB_MONTH_NAMES[new Date(firstOfMonth.date + "T00:00:00Z").getUTCMonth()];
}
function activityAverages() {
  const today = todayStr();
  const excluded = (d) => d === today || state.restDays.includes(d);
  const completedTasksCounted = state.tasks.filter(t => t.completed && t.completedDate && !excluded(t.completedDate));
  const allDates = completedTasksCounted.map(t => t.completedDate);

  const earliest = allDates.slice().sort()[0];

}

function projectStats(sinceDateInclusive) {

// Builds day-by-day cumulative "quests completed" series per project, for the
// line chart on the Projects page.
function buildQuestsOverTimeData() {
  const completedTasks = state.tasks.filter(t => t.completed && t.completedDate);
  if (completedTasks.length === 0) return null;

  const projectSet = new Set();
  completedTasks.forEach(t => projectSet.add(t.project && t.project.trim() ? t.project.trim() : "No project"));
  const projectList = Array.from(projectSet).sort((a, b) => {
    if (a === "No project") return 1;
    if (b === "No project") return -1;
    return a.localeCompare(b);
  });

  const sortedDates = completedTasks.map(t => t.completedDate).sort();
  const startDate = sortedDates[0];
  const endDate = todayStr();

  const days = [];
  let d = new Date(startDate + "T00:00:00Z");
  const end = new Date(endDate + "T00:00:00Z");
  while (d <= end) {
    days.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }

  const countsByProjectDate = {};
  projectList.forEach(p => { countsByProjectDate[p] = {}; });
  completedTasks.forEach(t => {
    const p = t.project && t.project.trim() ? t.project.trim() : "No project";
    countsByProjectDate[p][t.completedDate] = (countsByProjectDate[p][t.completedDate] || 0) + 1;
  });

  const series = {};
  projectList.forEach(p => {
    let cum = 0;
    series[p] = days.map(day => { cum += (countsByProjectDate[p][day] || 0); return cum; });
  });

  const maxVal = Math.max(1, ...projectList.map(p => series[p][series[p].length - 1]));
  return { days, projectList, series, maxVal };
}

function renderQuestsOverTimeChart() {
  const data = buildQuestsOverTimeData();
  if (!data || data.days.length < 2) {
    return `<p class="empty">Complete a few quests across more than one day to see this chart.</p>`;
  }
  const { days, projectList, series } = data;

  // Stack largest-total project at the bottom for a stable, readable shape —
  // avoids a tangle of crossing lines as more projects show up.
  const orderedProjects = [...projectList].sort((a, b) => {
    if (a === "No project") return 1;
    if (b === "No project") return -1;
    return series[b][series[b].length - 1] - series[a][series[a].length - 1];
  });

  const stackBottom = {}, stackTop = {};
  orderedProjects.forEach(p => { stackBottom[p] = []; stackTop[p] = []; });
  days.forEach((day, i) => {
    let running = 0;
    orderedProjects.forEach(p => {
      stackBottom[p][i] = running;
      running += series[p][i];
      stackTop[p][i] = running;
    });
  });
  const maxVal = Math.max(1, ...days.map((_, i) => orderedProjects.reduce((sum, p) => sum + series[p][i], 0)));

  const W = 640, H = 280, padL = 34, padR = 10, padT = 12, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const xFor = (i) => padL + (days.length <= 1 ? 0 : (i / (days.length - 1)) * chartW);
  const yFor = (v) => padT + chartH - (v / maxVal) * chartH;

  const gridSteps = 4;
  const gridHtml = Array.from({ length: gridSteps + 1 }, (_, i) => {
    const v = Math.round((maxVal / gridSteps) * i);
    const y = yFor(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--panel-border)" stroke-width="1"/><text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-dim)">${v}</text>`;
  }).join("");

  const tickCount = Math.min(6, days.length);
  const tickIdxs = Array.from(new Set(Array.from({ length: tickCount }, (_, i) => Math.round(i * (days.length - 1) / Math.max(1, tickCount - 1)))));
  const xLabelsHtml = tickIdxs.map(i => `<text x="${xFor(i).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--text-dim)">${days[i].slice(5)}</text>`).join("");

  const areasHtml = orderedProjects.map(p => {
    const color = p === "No project" ? "var(--text-dim)" : colorForProject(p);
    const topPts = days.map((_, i) => `${xFor(i).toFixed(1)},${yFor(stackTop[p][i]).toFixed(1)}`);
    const bottomPtsRev = days.map((_, i) => `${xFor(i).toFixed(1)},${yFor(stackBottom[p][i]).toFixed(1)}`).reverse();
    const points = [...topPts, ...bottomPtsRev].join(" ");
    return `<polygon points="${points}" fill="${color}" fill-opacity="0.85" stroke="var(--bg)" stroke-width="1"/>`;
  }).join("");

  const legendHtml = orderedProjects.map(p => {
    const color = p === "No project" ? "var(--text-dim)" : colorForProject(p);
    const total = series[p][series[p].length - 1];
    return `<span class="chart-legend-item"><span class="chart-legend-dot" style="background:${color}"></span>${escapeHtml(p)} (${total})</span>`;
  }).join("");

  return `
    <svg viewBox="0 0 ${W} ${H}" class="quests-chart-svg" preserveAspectRatio="xMidYMid meet">
      ${gridHtml}
      ${areasHtml}
      ${xLabelsHtml}
    </svg>
    <div class="chart-legend">${legendHtml}</div>
  `;
}

function canEndDay() { return state.player.lastProcessedDate !== todayStr() && !isWeekend(todayStr()); }

function shieldTask(id) {

// Mirrors endDay()'s damage/heal math exactly, without mutating anything —
// used to show a live preview of what tonight's resolution would do.
function forecastTonight() {
  const today = todayStr();
  const damageItems = [];
  let rawDamage = 0;
  state.tasks.forEach(t => {
    if (!t.completed && !isShielded(t)) {
      const overdue = daysOverdueCount(today, t.dueDate);
      if (overdue > 0) {
        const mult = bossMultiplier(t);
        const dmg = Math.max(1, Math.round((BASE_OVERDUE_DAMAGE * subzoneDamageMult()) * overdue * mult));
        rawDamage += dmg;
        damageItems.push({ title: t.title, amount: dmg });
      }
    }
  });

  let totalDamage = rawDamage;

  const isRestDay = state.restDays.includes(today);
  let restDaySkipped = 0;
  if (isRestDay && totalDamage > 0) {
    restDaySkipped = totalDamage;
    totalDamage = 0;
  }

  const resist = resistancePct();
  let resistSaved = 0;
  if (resist > 0 && totalDamage > 0) {
    const reduced = Math.round(totalDamage * (1 - resist / 100));
    resistSaved = totalDamage - reduced;
    totalDamage = reduced;
  }

  const armorBlock = armorBlockAmount();
  let armorSaved = 0;
  if (armorBlock > 0 && totalDamage > 0) {
    armorSaved = Math.min(armorBlock, totalDamage);
    totalDamage -= armorSaved;
  }

  const shield = equippedItem("offHand");
  const shieldBlock = shield && shield.blockAmount ? shield.blockAmount : 0;
  let shieldSaved = 0;
  if (shieldBlock > 0 && totalDamage > 0) {
    shieldSaved = Math.min(shieldBlock, totalDamage);
    totalDamage -= shieldSaved;
  }

  let stanceSaved = 0;
  if (state.player.defensiveStanceActive && totalDamage > 0) {
    const reduction = equippedItem("offHand") ? 20 : 10;
    stanceSaved = Math.min(reduction, totalDamage);
    totalDamage -= stanceSaved;
  }

  const slipDamage = pendingSlipDamage();
  totalDamage += slipDamage;

  const tasksCompletedSinceResolve = state.tasks.filter(t => t.completed && t.completedDate && t.completedDate > state.player.lastProcessedDate).length;
  const daysSinceResolve = Math.max(1, daysBetween(today, state.player.lastProcessedDate));
  const taskHeal = healTier(tasksCompletedSinceResolve);
  const regen = passiveRegen() * daysSinceResolve;

  // Evasive Maneuver is a gamble, not a guaranteed reduction, so it's never
  // rolled here — forecastTonight only previews what's knowable in advance.
  // evasiveChance > 0 just tells the UI to show "X% chance to dodge it all".
  const evasiveChance = (state.player.evasiveActive && totalDamage > 0) ? EVASIVE_DODGE_CHANCE : 0;

  return {
    damage: totalDamage, resist, armorBlock, shieldBlock, heal: taskHeal + regen,
    damageItems, rawDamage, resistSaved, armorSaved, shieldSaved, shieldName: shield ? shield.name : null,
    isRestDay, restDaySkipped, stanceSaved, evasiveChance, slipDamage,
    taskHeal, taskCount: tasksCompletedSinceResolve,
    regen, daysSinceResolve,
  };
}

// ---------- Nightly resolution ----------
// A "night" is resolved as of a specific calendar date, so the same logic
// serves both the manual End Day button (today) and the automatic catch-up
// for nights that passed while the app was closed. Tasks checked off AFTER
// that date (e.g. entered the next morning) were still open at the end of it.
function endOfDayMs(dateStr) { return new Date(dateStr + "T23:59:59").getTime(); }
function shieldedAsOf(t, date) {
  if (!t.shieldedUntil) return false;
  return date === todayStr() ? Date.now() < t.shieldedUntil : endOfDayMs(date) < t.shieldedUntil;
}
function openAsOf(t, date) {
  if (t.createdDate && t.createdDate > date) return false;
  return !t.completed || !!(t.completedDate && t.completedDate > date);
}

// Resolves one night (mutates state, no rendering). Returns the pieces the
// report needs.
function resolveNight(date) {
  const isToday = date === todayStr();
  const log = [];
  let totalDamage = 0;

  const prevLastProcessedDate = state.player.lastProcessedDate;
  const completedTasksList = state.tasks
    .filter(t => t.completed && t.completedDate && t.completedDate > prevLastProcessedDate && t.completedDate <= date)
    .map(t => ({ title: t.title, tier: t.tier, project: t.project || "" }));
  const startLevel = state.player.levelAtLastResolve;
  const startLifetimeXp = state.player.lifetimeXpAtLastResolve;

  state.tasks.forEach(t => {
    if (openAsOf(t, date)) {
      if (shieldedAsOf(t, date)) {
        log.push({ type: "shield", text: `${t.title} — shielded, no damage taken` });
        return;
      }
      const overdue = daysOverdueCount(date, t.dueDate);
      if (overdue > 0) {
        const mult = bossMultiplier(t);
        const dmg = Math.max(1, Math.round((BASE_OVERDUE_DAMAGE * subzoneDamageMult()) * overdue * mult));
        totalDamage += dmg;
        log.push({ type: "damage", text: `${t.title} — ${dmg} dmg (${overdue} day${overdue===1?"":"s"} overdue${mult > 1 ? `, ×${mult}` : ""})` });
      }
    }
  });

  if (state.restDays.includes(date) && totalDamage > 0) {
    log.push({ type: "heal", text: `Rest day — ${totalDamage} damage skipped.` });
    totalDamage = 0;
  }

  const resist = resistancePct();
  if (resist > 0 && totalDamage > 0) {
    const reduced = Math.round(totalDamage * (1 - resist / 100));
    log.push({ type: "info", text: `Damage resistance (${resist}%) reduced total damage from ${totalDamage} to ${reduced}.` });
    totalDamage = reduced;
  }

  const armorBlock = armorBlockAmount();
  if (armorBlock > 0 && totalDamage > 0) {
    const blocked = Math.min(armorBlock, totalDamage);
    totalDamage -= blocked;
    log.push({ type: "shield", text: `Armor blocked ${blocked} damage.` });
  }

  const shield = equippedItem("offHand");
  if (shield && shield.blockAmount && totalDamage > 0) {
    const blocked = Math.min(shield.blockAmount, totalDamage);
    totalDamage -= blocked;
    log.push({ type: "shield", text: `${shield.name} blocked ${blocked} damage.` });
  }

  if (state.player.defensiveStanceActive && totalDamage > 0) {
    const reduction = equippedItem("offHand") ? 20 : 10;
    const blocked = Math.min(reduction, totalDamage);
    totalDamage -= blocked;
    log.push({ type: "shield", text: `Defensive Stance reduced damage by ${blocked}.` });
  }
  state.player.defensiveStanceActive = false;

  if (state.player.evasiveActive && totalDamage > 0) {
    if (Math.random() < EVASIVE_DODGE_CHANCE) {
      log.push({ type: "heal", text: `Evasive Maneuver! You dodge all ${totalDamage} of the night's remaining damage.` });
      totalDamage = 0;
    } else {
      log.push({ type: "info", text: `Evasive Maneuver didn't pay off.` });
    }
  }
  state.player.evasiveActive = false;

  // Habit slips are self-inflicted: unblockable, and not waived by rest days.
  const slipResult = resolveSlips(date, prevLastProcessedDate, log);
  totalDamage += slipResult.slipDamage;

  const tasksCompletedSinceResolve = completedTasksList.length;
  const daysSinceResolve = Math.max(1, daysBetween(date, state.player.lastProcessedDate));
  const taskHeal = healTier(tasksCompletedSinceResolve);
  const regen = passiveRegen() * daysSinceResolve;
  const totalHeal = taskHeal + regen;

  if (taskHeal > 0) log.push({ type: "heal", text: `Quests: ${tasksCompletedSinceResolve} completed since last resolved — +${taskHeal} HP` });
  if (regen > 0) log.push({ type: "heal", text: `Passive regen${daysSinceResolve>1?` (${daysSinceResolve}d)`:""} — +${regen} HP` });
  if (totalDamage === 0 && totalHeal === 0) log.push({ type: "info", text: "A quiet stretch. No damage, no healing." });

  let newHp = state.player.hp - totalDamage + totalHeal;

  if (newHp <= 0) {
    if ((state.inventory.phoenix_feather || 0) > 0) {
      state.inventory.phoenix_feather -= 1;
      state.player.hp = 1;
      state.player.lastProcessedDate = date;
      log.push({ type: "heal", text: "A Phoenix Feather crumbles to ash — you survive at 1 HP." });
    } else {
      const subzoneId = state.region.currentSubzone;
      const subzoneName = subzoneMeta(subzoneId).name;
      const wasFirstCleared = getOrCreateSubzone(subzoneId).firstCleared;
      const lostItems = loseRandomInventoryItems(2);
      state.player.deathCount = (state.player.deathCount || 0) + 1;
      if (!Array.isArray(state.player.deathDates)) state.player.deathDates = [];
      if (!state.player.deathDates.includes(date)) state.player.deathDates.push(date);
      state.region.subzones[subzoneId] = { ...defaultSubzoneState(true), firstCleared: wasFirstCleared };
      state.region.townFromZone = subzoneZoneNum(subzoneId);
      state.region.mode = "town";
      state.region.currentSubzone = townAnchor();
      state.player.hp = state.player.maxHp;
      state.player.lastProcessedDate = date;
      const lostText = Object.entries(lostItems).map(([id, count]) => {
        const item = LOOT_TABLE.find(i => i.id === id);
        return `${count}× ${item ? item.name : id}`;
      }).join(", ") || "nothing — your bags were already empty";
      const progressText = wasFirstCleared
        ? `Your current run through ${subzoneName} was lost, but it's still marked cleared.`
        : `${subzoneName} wasn't completed and will need a fresh start.`;
      log.push({ type: "downed", text: `DOWNED — you wake up back in town. Lost: ${lostText}. ${progressText}` });
    }
  } else {
    state.player.hp = Math.min(newHp, state.player.maxHp);
    state.player.lastProcessedDate = date;
  }

  state.player.lifetimeXpAtLastResolve = state.player.lifetimeXp;
  state.player.levelAtLastResolve = state.player.level;

  return { date, log, completedTasksList, startLevel, startLifetimeXp };
}

// Builds the single Nightly Report modal from one or more resolved nights.
function showNightlyReport(results, skippedNights) {
  const multi = results.length > 1;
  const log = [];
  if (skippedNights > 0) {
    log.push({ type: "info", text: `${skippedNights} older missed night${skippedNights===1?"":"s"} before this were forgiven (catch-up is capped at ${MAX_AUTO_NIGHTS}).` });
  }
  results.forEach(r => {
    if (multi || r.date !== todayStr()) {
      const label = new Date(r.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
      log.push({ type: "info", text: `<b>${label}</b>` });
    }
    r.log.forEach(e => log.push(e));
  });

  const completedTasksList = results.flatMap(r => r.completedTasksList);
  const projectMap = {};
  completedTasksList.forEach(t => {
    const key = t.project && t.project.trim() ? t.project.trim() : "No project";
    projectMap[key] = projectMap[key] || { tasks: 0 };
    projectMap[key].tasks += 1;
  });
  const projectBreakdown = Object.entries(projectMap)
    .map(([project, v]) => ({ project, ...v }))
    .sort((a, b) => b.tasks - a.tasks);

  daySummary = {
    tasksCompleted: completedTasksList,
    xpGained: state.player.lifetimeXp - results[0].startLifetimeXp,
    levelDelta: state.player.level - results[0].startLevel,
    newLevel: state.player.level,
    projectBreakdown,
  };
  eventLog = log;
  showLog = true;
}

function endDay(force) {
  if (!force && !canEndDay()) return;
  showNightlyReport([resolveNight(todayStr())], 0);
  save(); render();
}

// ---------- Automatic end-of-day ----------
// The app can't run while the browser is closed, so "automatic" means: any
// weekday night that passed since the last resolution is applied the moment
// the app is next opened (or a day rolls over while it's open). Nothing is
// forgiven for forgetting — tasks checked off the next morning count as that
// morning's, so the missed night still sees them as open.
const MAX_AUTO_NIGHTS = 10; // safety valve for very long absences (each downing costs items)
function missedNights() {
  const prev = state.player.lastProcessedDate;
  if (isNaN(Date.parse(prev))) return [];
  const today = todayStr();
  const nights = [];
  let d = addDaysToDateStr(prev, 1);
  while (d < today && nights.length < 5000) {
    if (!isWeekend(d)) nights.push(d);
    d = addDaysToDateStr(d, 1);
  }
  return nights;
}
function autoResolveMissedNights() {
  if (state.settings.autoEndDay === false) return false;
  const nights = missedNights();
  if (nights.length === 0) return false;
  const skipped = Math.max(0, nights.length - MAX_AUTO_NIGHTS);
  const results = nights.slice(skipped).map(d => resolveNight(d));
  showNightlyReport(results, skipped);
  save();
  return true;
}
function checkForNewDay() { if (autoResolveMissedNights()) render(); }
function toggleAutoEndDay() { state.settings.autoEndDay = !(state.settings.autoEndDay !== false); save(); if (state.settings.autoEndDay) checkForNewDay(); else render(); }

    habits: Array.isArray(parsed.habits) ? parsed.habits : [],

      autoEndDay: typeof (parsed.settings && parsed.settings.autoEndDay) === "boolean" ? parsed.settings.autoEndDay : true },

    restDays: Array.isArray(parsed.restDays) ? parsed.restDays : [],
    customQuests: Array.isArray(parsed.customQuests) ? parsed.customQuests : [],
    savedAt: typeof parsed.savedAt === "number" ? parsed.savedAt : 0,
  };
  migratePhoenixCharges(state.player, state.inventory);
  Object.entries(state.region.subzones).forEach(([id, sz]) => fixBuggedFarmLapEnemy(sz, subzoneZoneNum(id)));
  {
    const names = new Set();
    state.tasks.forEach(t => { if (t.project) names.add(t.project); });
    state.sessionLog.forEach(s => { if (s.project) names.add(s.project); });
    names.forEach(ensureProjectColor);
  }
}

// ---------- Cloud sync via a private GitHub Gist ----------
// The whole save is stored as one file in a secret Gist. "dirty" = this device
// has changes the cloud hasn't seen; "lastSynced" = the savedAt stamp both
// sides last agreed on. Comparing for equality (not "newer than") keeps this
// correct even if the two devices' clocks disagree.
function isPristineState() {
  return state.tasks.length === 0 && (state.player.lifetimeXp || 0) === 0 && state.player.level <= 1 && (state.habits || []).length === 0;
}
async function gistRequest(method, path, body) {
  const res = await fetch("https://api.github.com" + path, {
    method,
    headers: Object.assign({ "Authorization": "Bearer " + syncCfg.token, "Accept": "application/vnd.github+json" }, body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = new Error(res.status === 401 ? "GitHub rejected the token (401). Check it has the 'gist' permission and hasn't expired."
      : res.status === 404 ? "Couldn't find that Gist (404). Check the Gist ID, and that the token belongs to the same GitHub account."
      : res.status === 403 ? "GitHub refused the request (403) — rate limit or missing permission."
      : "GitHub error " + res.status);
    err.status = res.status;
    throw err;
  }
  return res.json();
}
async function fetchRemoteSave() {
  const data = await gistRequest("GET", "/gists/" + syncCfg.gistId);
  const file = data.files && data.files[SYNC_FILE];
  if (!file) return null;
  let text = file.content;
  if (file.truncated || typeof text !== "string") {
    const raw = await fetch(file.raw_url);
    text = await raw.text();
  }
  const obj = JSON.parse(text);
  if (!isValidSave(obj)) throw new Error("The Gist's save file isn't a valid Quest Log save.");
  return obj;
}
async function pushToGist() {
  if (!state.savedAt) state.savedAt = Date.now();
  const content = JSON.stringify(state);
  const files = { [SYNC_FILE]: { content } };
  if (!syncCfg.gistId) {
    const created = await gistRequest("POST", "/gists", { description: "Quest Log save (private)", public: false, files });
    syncCfg.gistId = created.id;
  } else {
    await gistRequest("PATCH", "/gists/" + syncCfg.gistId, { files });
  }
  syncCfg.lastSynced = state.savedAt;
  syncCfg.dirty = false;
  syncCfg.lastAt = Date.now();
  saveSyncCfg();
}
function pullFromObject(obj) {
  applySaveObject(obj);
  state.savedAt = typeof obj.savedAt === "number" ? obj.savedAt : Date.now();
  save(true);
  syncCfg.lastSynced = state.savedAt;
  syncCfg.dirty = false;
  syncCfg.lastAt = Date.now();
  saveSyncCfg();
}
function scheduleSyncPush() {
  if (syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => { syncPushTimer = null; syncNow(); }, 2500);
}
// Returns a short status string. Never throws.
async function syncNow(reason) {
  if (!syncCfg.token || syncStatus.busy) return;
  syncStatus.busy = true;
  if (reason === "manual" || reason === "connect") { syncStatus.text = "Syncing…"; syncStatus.ok = true; render(); }
  try {
    if (!syncCfg.gistId) {
      await pushToGist();
      syncStatus = { busy: false, ok: true, text: "Connected. Your save was uploaded to a new private Gist." };
    } else {
      const remote = await fetchRemoteSave();
      const remoteChanged = !remote ? false : (remote.savedAt || 0) !== syncCfg.lastSynced;
      const localChanged = syncCfg.dirty && !(syncCfg.lastSynced === 0 && isPristineState());
      let msg = "Up to date.";
      if (!remote) { await pushToGist(); msg = "Uploaded your save."; }
      else if (!remoteChanged && !localChanged) { syncCfg.dirty = false; saveSyncCfg(); }
      else if (localChanged && !remoteChanged) { await pushToGist(); msg = "Uploaded your latest changes."; }
      else if (!localChanged && remoteChanged) { pullFromObject(remote); msg = "Downloaded the newer save from the cloud."; }
      else {
        const keepLocal = confirm("This device and the cloud both have changes the other hasn't seen.\n\nOK = keep THIS device's save (overwrites the cloud)\nCancel = use the CLOUD save (overwrites this device)");
        if (keepLocal) { await pushToGist(); msg = "Kept this device's save and uploaded it."; }
        else { pullFromObject(remote); msg = "Used the cloud save on this device."; }
      }
      syncStatus = { busy: false, ok: true, text: msg };
    }
  } catch (e) {
    console.error("Sync failed", e);
    syncStatus = { busy: false, ok: false, text: (e && e.message) ? (e.message === "Failed to fetch" ? "Couldn't reach GitHub (offline?). Your changes are kept and will upload later." : e.message) : "Sync failed." };
  }
  render();
}
function connectSync(token, gistId) {
  token = (token || "").trim();
  gistId = (gistId || "").trim();
  if (!token) { syncStatus = { busy: false, ok: false, text: "Paste a GitHub token first." }; render(); return Promise.resolve(); }
  syncCfg = { token, gistId, lastSynced: 0, dirty: true, lastAt: 0 };
  saveSyncCfg();
  return syncNow("connect");
}
function disconnectSync() {
  syncCfg = { token: "", gistId: syncCfg.gistId, lastSynced: 0, dirty: false, lastAt: 0 };
  saveSyncCfg();
  syncStatus = { busy: false, ok: true, text: "Disconnected. This device keeps its own save." };
  render();
}
function syncPanelHtml() {

      <p class="settings-desc">Gist ID (enter this on your other device): <b style="user-select:all;word-break:break-all">${escapeHtml(syncCfg.gistId || "(created on first sync)")}</b></p>

function exportSave() {
  try {
    const payload = { savedAt: new Date().toISOString(), ...state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `quest-log-save-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    importMsg = { ok: true, text: "Save file downloaded." };
  } catch (e) {
    console.error("Export failed", e);
    importMsg = { ok: false, text: "Export failed — see browser console for details." };
  }
  render();

function isValidSave(obj) {
  return obj && obj.player && typeof obj.player.hp === "number" && typeof obj.player.level === "number"
    && Array.isArray(obj.tasks) && obj.dailySessions;
}

function importSave(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!isValidSave(parsed)) throw new Error("File doesn't look like a Quest Log save.");
      applySaveObject(parsed);
      save();
      importMsg = { ok: true, text: "Save imported successfully." };
    } catch (err) {
      console.error("Import failed", err);
      importMsg = { ok: false, text: "Couldn't import that file — " + err.message };
    }
    render();
  };
  reader.onerror = () => { importMsg = { ok: false, text: "Couldn't read that file." }; render(); };
  reader.readAsText(file);
}

              <h3>${ic("flag",15)} Bulletin Board</h3><span class="shop-gold">Zone ${state.region.townFromZone || 1}: ${escapeHtml(zoneMeta(state.region.townFromZone || 1).name)}</span>

                return `<li class="bulletin-item">
                  <div class="bulletin-item-head">
                    <span class="bulletin-item-title">${escapeHtml(quest.title)}${quest.repeatable ? ` <span class="repeat-badge" title="Stays on the board after you turn it in">${ic("repeat",11)} Repeatable</span>` : ""}</span>

                    <span class="bulletin-item-reward">${ic("sparkle",11)} ${quest.rewardXP} XP · ${ic("coin",11)} ${quest.rewardGold} · ${ic("shieldcheck",11)} ${quest.rewardReputation || 0} rep${quest.bonusItemId?` · chance of bonus item`:""}</span>

          ${inCity() ? guildHallsHtml() : ""}
          ${reachedZones().length > 1 || (reachedZones().length === 1 && reachedZones()[0] !== subzoneZoneNum(townAnchor())) ? `
          <div class="shop-panel">
            <div class="shop-head"><h3>${ic("flag",15)} Fast Travel</h3><span class="shop-gold">${ic("coin",13)} ${state.player.gold || 0} gold</span></div>
