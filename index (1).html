            <ul class="bulletin-list">
              ${reachedZones().map(z => { const cost = fastTravelCost(z); const can = (state.player.gold || 0) >= cost; return `<li class="bulletin-item"><div class="bulletin-item-head"><span class="bulletin-item-title">Zone ${z}: ${escapeHtml(zoneMeta(z).name)}</span><span class="bulletin-item-req">${escapeHtml(subzoneMeta(globalSubzoneId(z,1)).name)}</span></div><div class="bulletin-item-footer"><span class="bulletin-item-reward">${ic("coin",11)} ${cost} gold</span><button class="btn btn-turnin" data-fast-travel="${z}" ${can?"":"disabled"}>Travel</button></div></li>`; }).join("")}
            </ul>
          </div>` : ""}
          <div class="shop-panel">
            <div class="shop-head">
              <h3>${ic("heart",15)} Inn</h3>
              <span class="shop-gold">${ic("coin",13)} ${state.player.gold || 0} gold</span>
            </div>
            <div class="inn-row">
              <div class="inn-desc">
                <span class="inn-desc-title">Rest for the night</span>
                <span class="inn-desc-sub">Fully heal — ${state.player.hp}/${state.player.maxHp} HP right now.</span>
              </div>
              <button class="btn btn-buy" id="btn-inn-rest" ${(state.player.gold||0) < 50 || state.player.hp >= state.player.maxHp ? "disabled" : ""}>${ic("coin",13)} 50 — Rest</button>
            </div>
          </div>
          <div class="shop-panel">
            <div class="shop-head">
              <h3>${ic("gift",15)} Shop</h3>
              <span class="shop-gold">${ic("coin",13)} ${state.player.gold || 0} gold</span>
              <span class="shop-rep">${ic("shieldcheck",13)} ${currentReputation()} reputation (best in any zone)</span>
            </div>
            <div class="shop-section-label">Buy</div>
            <ul class="shop-list">
              ${LOOT_TABLE.filter(i => i.shopOnly && (!i.zone || i.zone === zone)).map(item => {
                const alreadyOwned = item.permanent && (state.inventory[item.id] || 0) > 0;
                const canAfford = (state.player.gold || 0) >= item.price;
                const repReq = item.repReq || 0;
                const meetsRep = currentReputation() >= repReq;
                const stat = itemStatText(item);
                const unlocks = unlockedRecipeNames(item.id);
                return `<li class="shop-item shop-item-stacked">
                  <div class="shop-item-row">
                    <span style="color:var(--gold)">${ic(item.icon,16)}</span>
                    <span class="inv-name">${item.name}</span>
                    ${stat ? `<span class="item-stat-badge">${stat}</span>` : ""}
                    ${alreadyOwned
                      ? `<span class="done-badge">✓ Owned</span>`
                      : !meetsRep
                        ? `<span class="rep-locked">${ic("shieldalert",11)} Requires ${repReq} reputation</span>`
                        : `<span class="inv-price">${ic("coin",11)} ${item.price}</span><button class="btn btn-buy" data-buy="${item.id}" ${canAfford?"":"disabled"}>Buy</button>`}
                  </div>
                  ${item.desc ? `<p class="shop-item-desc">${escapeHtml(item.desc)}</p>` : ""}
                  ${unlocks ? `<p class="shop-item-desc">Unlocks: ${escapeHtml(unlocks)}</p>` : ""}
                </li>`;
              }).join("")}
            </ul>
            <div class="shop-section-label">Sell</div>
            ${Object.keys(state.inventory).filter(id => state.inventory[id] > 0).length === 0 ? `<p class="empty">Nothing in your bags to sell.</p>` : `
            <ul class="shop-list">
              ${LOOT_TABLE.filter(item => state.inventory[item.id] > 0).map(item => `
                <li class="shop-item shop-item-stacked">
                  <div class="shop-item-row">
                    <span style="color:var(--gold)">${ic(item.icon,16)}</span>
                    <span class="inv-name">${item.name}</span>
                    ${itemStatText(item) ? `<span class="item-stat-badge">${itemStatText(item)}</span>` : ""}
                    <span class="inv-count">×${state.inventory[item.id]}</span>
                    <span class="inv-price">${ic("coin",11)} ${item.price}</span>
                    <button class="btn btn-sell" data-sell="${item.id}">Sell</button>
                  </div>
                  ${item.desc ? `<p class="shop-item-desc">${escapeHtml(item.desc)}</p>` : ""}
                </li>`).join("")}
            </ul>`}
          </div>
          <button class="btn btn-leave-town" id="btn-leave-town">Leave Town</button>
        </div>
        ` : state.region.mode === "choice" ? `
        <div class="choice-screen">
          <p class="road-story" style="margin-bottom:10px">${sz.firstCleared ? `${escapeHtml(subzoneMeta(subzoneId).name)} cleared for now.` : `You've stepped back from ${escapeHtml(subzoneMeta(subzoneId).name)}.`} What next?</p>
          <div class="choice-buttons">
            <button class="choice-btn" id="btn-choice-stay">
              <span class="choice-btn-title">${ic("shieldalert",14)} Stay in ${escapeHtml(subzoneMeta(subzoneId).name)}</span>
              <span class="choice-btn-sub">${sz.firstCleared ? `Keep farming here — a shorter ${FARM_LOOP_SIZE}-step lap, same rewards.` : `Continue your first run here — ${ZONE_SIZE} steps to clear it.`}</span>
            </button>
            ${subzoneNeighbors(subzoneId).filter(id => getOrCreateSubzone(id).unlocked).map(id => {
              const crossesZone = subzoneZoneNum(id) !== subzoneZoneNum(subzoneId);
              return `
            <button class="choice-btn" data-choice-move="${id}">
              <span class="choice-btn-title">${ic("flag",14)} Move to ${escapeHtml(subzoneMeta(id).name)}${crossesZone ? ` (Zone ${subzoneZoneNum(id)})` : ""}</span>
              <span class="choice-btn-sub">${state.region.subzones[id].firstCleared ? "Already cleared — resume farming there." : crossesZone ? `Cross into Zone ${subzoneZoneNum(id)}.` : "Continue the journey."}</span>
            </button>`;
            }).join("")}
            <button class="choice-btn" id="btn-choice-town">
              <span class="choice-btn-title">${ic("crown",14)} ${inCity() ? "Return to the Forest City" : "Return to Town"}</span>
              <span class="choice-btn-sub">${inCity() ? "Shop, Inn, Bulletin Board and Guild Halls. You'll leave from the Forest Gate." : "Shop, rest at the Inn, and the Bulletin Board."}</span>
            </button>
          </div>
        </div>
        ` : `
        <div class="road-steps">
          ${Array.from({length: loop}, (_, i) => {
            const stepNum = i + 1;
            const isBossStep = isFirstRun(sz) && stepNum === loop;
            const passed = stepNum <= pos;
            const isCurrent = stepNum === pos + 1;
            return `<div class="road-step ${passed?"passed":""} ${isCurrent?"current":""} ${isBossStep?"boss-step":""}" title="Step ${stepNum}${isBossStep?' — Guardian':''}">${isBossStep ? ic("skull", 12) : ""}</div>`;
          }).join("")}
        </div>
        <div class="road-progress">Step ${Math.min(pos+1, loop)}/${loop}${isFirstRun(sz) && pos >= loop-1 ? " — Guardian" : !isFirstRun(sz) ? " (farming lap)" : ""}</div>
        <div class="retreat-row">
          ${!confirmRetreat ? `<button class="link-btn subtle" id="btn-ask-retreat">Return to Town</button>` : `
          <span class="reset-confirm">Abandon your current progress here and return to town? There's a ${Math.round(RETREAT_DROP_CHANCE*100)}% chance you'll drop a random item. <button class="link-btn" id="btn-confirm-retreat">Yes</button> · <button class="link-btn" id="btn-cancel-retreat">Cancel</button></span>
          `}
        </div>
        ${!sz.currentEnemyKey ? `
        <div class="enemy-choice">
          <p class="road-story" style="margin-bottom:8px">Choose your foe:</p>
          <div class="enemy-choice-buttons">
            ${enemyPair.map(key => {
              const e = ENEMIES[key];
              const drops = e.flavorDrops.map(fid => LOOT_TABLE.find(i => i.id === fid).name).join(", ");
              return `<button class="enemy-choice-btn" data-choose-enemy="${key}">
                <span class="enemy-choice-name">${escapeHtml(e.name)}</span>
                <span class="enemy-choice-drops">May drop: ${escapeHtml(drops)}</span>
              </button>`;
            }).join("")}
          </div>
        </div>` : `
        <div class="enemy-hp-row">
          <span class="enemy-hp-label">${isFirstRun(sz) && pos >= loop-1 ? ic("skull",13) : ic("shieldalert",13)} ${isFirstRun(sz) && pos >= loop-1 ? "Guardian" : escapeHtml(ENEMIES[sz.currentEnemyKey].name)}</span>
          <div class="bar-track enemy-hp-track">
            <div class="bar-fill enemy-hp-fill" style="width:${Math.max(0, (sz.enemyHp / sz.enemyMaxHp) * 100)}%"></div>
            <span class="bar-num">${Math.round(Math.max(0, sz.enemyHp))} / ${Math.round(sz.enemyMaxHp)}</span>
          </div>
        </div>`}
        <p class="road-story">${storyBeat()}</p>
        ${isFirstRun(sz) && pos >= loop - 1 ? `
          <div class="zone-boss-cards">
            ${bosses.map(b => {
              const defeated = sz.bossesDefeated.includes(b.id);
              return `<div class="zone-boss-card ${defeated?"defeated":""}">
                <span>${defeated ? ic("shieldcheck",14,"var(--heal)") : ic("skull",14,"var(--blood-bright)")}</span>
                <span class="zone-boss-title">${escapeHtml(b.title)}</span>
                <span class="zone-boss-status">${defeated ? "Extra damage dealt" : "Hits the guardian extra hard"}</span>
              </div>`;
            }).join("")}
            ${bosses.length < 2 ? `<p class="road-story" style="margin-top:8px">Add ${2 - bosses.length} more active quest${2-bosses.length>1?"s":""} to fully summon what's guarding this step.</p>` : ""}
          </div>
        ` : ""}
        `}
      </section>



      <datalist id="project-suggestions">
        ${allProjectNames().map(p => `<option value="${escapeHtml(p)}"></option>`).join("")}
      </datalist>

      <section class="panel week-panel">
        <div class="panel-head"><h2>This Week</h2><span class="panel-sub">Started ${state.week.weekStart}</span></div>
        <div class="week-status">
          <span class="week-stat">${ic("shieldalert",13)} Shield: ${shieldsAvailable() - state.week.shieldsUsed}/${shieldsAvailable()} available</span>
          <span class="week-stat">${ic("crown",13)} Boss: ${weeklyBossTask ? escapeHtml(weeklyBossTask.title) : "none selected"}</span>
        </div>
        <button class="btn btn-newweek" id="btn-newweek">${ic("crown",15)} New Week</button>
        <div class="week-note">Picks a random active quest as this week's boss (2–3× overdue damage, bonus reward on completion) and refreshes your shields.</div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>New Task</h2></div>
        <div class="new-task-form">
          <input class="input input-full" id="input-title" placeholder="What needs doing?" value="${escapeHtml(formTitle)}">
          <div class="new-task-row">
            <input class="input input-project" id="input-project" list="project-suggestions" placeholder="Project (optional)" value="${escapeHtml(formProject)}">
            <input class="input input-date" id="input-date" type="date" value="${formDue}">
            <select class="input input-tier" id="input-tier">
              <option value="minion" ${formTier==="minion"?"selected":""}>Minor</option>
              <option value="elite" ${formTier==="elite"?"selected":""}>Major</option>
              <option value="boss" ${formTier==="boss"?"selected":""}>Master</option>
            </select>
            <button class="btn btn-add" id="btn-add">${ic("plus",15)} Add</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Tasks</h2><span class="panel-sub">${state.tasks.filter(t=>!t.completed).length} active</span></div>
        ${questFilters.length > 0 ? `<div class="filtered-count">${state.tasks.filter(t => !t.completed && questFilters.includes(t.project ? t.project : "__none__")).length} active in filter</div>` : ""}
        <div class="quest-controls-row">
          ${allProjectNames().length > 0 ? `
          <div class="filter-dropdown">
            <button class="filter-dropdown-trigger" id="btn-filter-toggle">
              ${ic("flag",12)} ${questFilters.length===0 ? "All projects" : `${questFilters.length} project${questFilters.length===1?"":"s"} selected`} <span class="chevron">${questFilterOpen?"▴":"▾"}</span>
            </button>
            ${questFilterOpen ? `
            <div class="filter-dropdown-panel">
              ${questFilters.length>0 ? `<button class="filter-clear-link" id="btn-filter-clear">Clear filters</button>` : ""}
              <label class="filter-checkbox-row">
                <input type="checkbox" data-filter-checkbox="__none__" ${questFilters.includes("__none__")?"checked":""}>
                <span>No project</span>
              </label>
              ${allProjectNames().map(pn => `
              <label class="filter-checkbox-row">
                <input type="checkbox" data-filter-checkbox="${escapeHtml(pn)}" ${questFilters.includes(pn)?"checked":""}>
                <span style="color:${colorForProject(pn)}">${ic("flag",10)} ${escapeHtml(pn)}</span>
              </label>`).join("")}
            </div>` : ""}
          </div>` : ""}
          <label class="hide-completed-row">
            <input type="checkbox" id="hide-completed-checkbox" ${state.settings.archiveCompleted?"checked":""}>
            <span>Archive completed${sorted.filter(t=>t.completed).length > 0 ? ` (${sorted.filter(t=>t.completed).length})` : ""}</span>
          </label>
        </div>
        ${(() => {
          let filteredSorted = questFilters.length === 0 ? sorted
            : sorted.filter(t => questFilters.includes(t.project ? t.project : "__none__"));
          if (state.settings.archiveCompleted) filteredSorted = filteredSorted.filter(t => !t.completed);
          if (filteredSorted.length === 0) return `<p class="empty">${sorted.length===0 ? "No quests logged. The realm is quiet — add one above." : "No quests match the current filters."}</p>`;
          return `
        <ul class="task-list">
          ${filteredSorted.map(t => {
            const tier = TIERS[t.tier];
            const overdue = !t.completed ? daysOverdueCount(today, t.dueDate) : 0;
            const shielded = isShielded(t);
            const weeklyBoss = !t.completed && t.id === state.week.weeklyBossTaskId && t.tier !== "boss";
            const zoneBoss = !t.completed && currentSubzoneState().bossIds.includes(t.id);
            const mult = bossMultiplier(t);
            const pendingDmg = overdue > 0 ? Math.max(1, Math.round((BASE_OVERDUE_DAMAGE * subzoneDamageMult()) * overdue * mult)) : 0;
            const canShield = !t.completed && !shielded && (state.week.shieldsUsed < shieldsAvailable());
            const projectControl = editingProjectTaskId === t.id
              ? `<input class="input project-edit-input" id="project-edit-${t.id}" list="project-suggestions" value="${escapeHtml(t.project||"")}" data-project-edit="${t.id}" placeholder="Project name">`
              : t.project
                ? `<button class="project-flag-btn" data-edit-project="${t.id}" style="color:${colorForProject(t.project)}" title="Click to change project">${ic("flag",11)} ${escapeHtml(t.project)}</button>`
                : `<button class="project-add-btn" data-edit-project="${t.id}" title="Assign a project">+ project</button>`;
            const showTierEditor = editingTierTaskId === t.id;
            const showRecurEditor = editingRecurTaskId === t.id;
            const showTitleEditor = editingTitleTaskId === t.id;
            const showDueEditor = editingDueTaskId === t.id;
            const canAffordResched = (state.player.gold || 0) >= RESCHEDULE_COST;
            const showMenu = taskMenuOpenId === t.id;
            return `
            <li class="task-item tier-${t.tier} ${t.completed?"done":""} ${overdue>0?"overdue":""} ${shielded?"shielded":""} ${zoneBoss?"zone-boss":""} ${t.flagged?"flagged":""}">
              <span style="color:${tier.color}">${ic(tier.icon,16)}</span>
              <div class="task-body">
                ${showTitleEditor ? `<div class="inline-editor"><input class="input" id="title-edit-${t.id}" data-title-edit="${t.id}" value="${escapeHtml(t.title)}" style="flex:1;min-width:160px"><button class="link-btn" data-title-save="${t.id}">Save</button><button class="link-btn subtle" data-cancel-edit>Cancel</button></div>` : `<span class="task-title">${escapeHtml(t.title)}</span>`}
                ${showDueEditor ? `
                <div class="inline-editor">
                  <span class="inline-editor-label">New due date:</span>
                  <input class="input input-date" type="date" id="resched-date-${t.id}" min="${today}" value="${t.dueDate > today ? t.dueDate : today}">
                  <button class="link-btn" data-resched-confirm="${t.id}" ${canAffordResched?"":"disabled"}>${ic("coin",12)} Pay ${RESCHEDULE_COST} &amp; move</button>
                  <button class="link-btn subtle" data-cancel-edit>Cancel</button>
                  ${canAffordResched ? "" : `<span class="inline-editor-label">You need ${RESCHEDULE_COST} gold (you have ${state.player.gold || 0}).</span>`}
                </div>` : ""}
                ${showTierEditor ? `
                <div class="inline-editor">
                  <span class="inline-editor-label">Change level:</span>
                  ${Object.entries(TIERS).map(([key,meta]) => `<button class="pick-btn ${t.tier===key?"pick-btn-active":""}" data-set-tier="${t.id}" data-tier-value="${key}" style="color:${meta.color}">${ic(meta.icon,12)} ${meta.label}</button>`).join("")}
                  <button class="link-btn subtle" data-cancel-edit>Cancel</button>
                </div>
                ` : showRecurEditor ? `
                <div class="inline-editor">
                  <span class="inline-editor-label">Repeat:</span>
                  <button class="pick-btn ${t.recurring&&t.recurring.type==="daily"?"pick-btn-active":""}" data-set-recur="${t.id}" data-recur-type="daily">Daily</button>
                  <button class="pick-btn ${t.recurring&&t.recurring.type==="weekly"?"pick-btn-active":""}" data-set-recur="${t.id}" data-recur-type="weekly">Weekly</button>
                  <span class="recur-custom">Every <input type="number" min="1" class="input recur-days-input" id="recur-days-${t.id}" value="${t.recurring&&t.recurring.type==="custom"?t.recurring.days:2}"> days <button class="link-btn" data-set-recur-custom="${t.id}">Set</button></span>
                  ${t.recurring?`<button class="link-btn" data-set-recur="${t.id}" data-recur-type="__clear__">Remove</button>`:""}
                  <button class="link-btn subtle" data-cancel-edit>Cancel</button>
                </div>
                ` : `
                <span class="task-meta">
                  ${projectControl}
                  ${tier.label} · due ${t.dueDate}${t.rescheduledCount ? ` <span class="recur-badge" title="Moved ${t.rescheduledCount} time${t.rescheduledCount===1?"":"s"}">moved ${t.rescheduledCount}×</span>` : ""}
                  ${t.recurring?`<span class="recur-badge" title="Repeats ${recurringLabel(t.recurring)}">${ic("repeat",11)} ${recurringLabel(t.recurring)}</span>`:""}
                  ${zoneBoss?`<span class="zone-boss-badge">${ic("skull",11)} Zone boss</span>`:""}
                  ${weeklyBoss?`<span class="weekly-boss-badge">${ic("crown",11)} Week's boss</span>`:""}
                  ${shielded?`<span class="shield-badge">${ic("shieldalert",11)} Shielded until ${new Date(t.shieldedUntil).toLocaleString()}</span>`
                    : overdue>0?`<span class="dmg-badge">${ic("shieldalert",11)} ${pendingDmg} dmg tonight</span>`:""}
                  ${t.completed?`<span class="done-badge">✓ completed ${t.completedDate}</span>`:""}
                </span>
                `}
              </div>
              ${!t.completed?`<button class="btn btn-complete" data-complete="${t.id}">Complete</button>`:""}
              ${!t.completed?`<button class="btn btn-icon btn-flag ${t.flagged?"btn-flag-active":""}" data-toggle-flag="${t.id}" aria-label="${t.flagged?"Unflag":"Flag"} this task">${ic("flag",14)}</button>`:""}
              ${canShield?`<button class="btn btn-icon btn-shield" data-shield="${t.id}" aria-label="Shield this quest">${ic("shieldalert",14)}</button>`:""}
              ${!t.completed?`
              <div class="task-menu-wrap">
                <button class="btn btn-icon" data-toggle-menu="${t.id}" aria-label="More options">⋯</button>
                ${showMenu ? `
                <div class="task-menu-popover">
                  <button data-menu-recur="${t.id}">${ic("repeat",13)} Set as recurring</button>
                  <button data-menu-title="${t.id}">${ic("sword",13)} Rename</button>
                  <button data-menu-due="${t.id}">${ic("coin",13)} Reschedule (${RESCHEDULE_COST}g)</button>
                  <button data-menu-tier="${t.id}">${ic("flame",13)} Change level</button>
                  <button data-menu-project="${t.id}">${ic("flag",13)} Change project</button>
                </div>` : ""}
              </div>` : ""}
              <button class="btn btn-icon" data-remove="${t.id}" aria-label="Delete quest">${ic("trash",14)}</button>
            </li>`;
          }).join("")}
        </ul>`;
        })()}
      </section>

      <section class="panel end-day-panel">
        <button class="btn btn-endday" id="btn-endday" ${!canEndDay()?"disabled":""}>${ic("moon",16)} End Day</button>
        ${!canEndDay() ? `<div class="endday-note">${isWeekend(todayStr()) ? "It's the weekend — damage is paused, no resolution needed. Enjoy the break!" : "Today's already resolved. Past nights apply automatically when you open the app."} <button class="link-btn" id="btn-force-endday">Force resolve anyway (test mode)</button></div>` : ""}
      </section>` : ""}

      ${showLog ? `
      <div class="log-overlay" id="log-overlay">
        <div class="log-card" onclick="event.stopPropagation()">
          <h3>${ic("trophy",16)} Nightly Report</h3>
          ${daySummary ? `
          <div class="day-summary">
            <div class="summary-row">${ic("sparkle",13)} <b>${daySummary.xpGained}</b> XP gained</div>
            ${daySummary.levelDelta > 0 ? `<div class="summary-row level-up">${ic("crown",13)} Leveled up to <b>${daySummary.newLevel}</b>!</div>` : ""}
            ${daySummary.levelDelta < 0 ? `<div class="summary-row level-down">${ic("skull",13)} Dropped to level <b>${daySummary.newLevel}</b></div>` : ""}
            <div class="summary-row">${ic("shieldcheck",13)} <b>${daySummary.tasksCompleted.length}</b> quest${daySummary.tasksCompleted.length===1?"":"s"} completed</div>
            ${daySummary.tasksCompleted.length > 0 ? `
            <ul class="summary-task-list">
              ${daySummary.tasksCompleted.map(t => `<li><span style="color:${TIERS[t.tier].color}">${ic(TIERS[t.tier].icon,12)}</span> ${escapeHtml(t.title)}${t.project?` <span class="task-project-tag" style="color:${colorForProject(t.project)}">${ic("flag",9)} ${escapeHtml(t.project)}</span>`:""}</li>`).join("")}
            </ul>` : ""}
            ${daySummary.projectBreakdown.length > 0 ? `
            <div class="summary-projects">
              <div class="summary-projects-label">By project</div>
              <ul class="summary-project-list">
                ${daySummary.projectBreakdown.map(pb => `<li>${escapeHtml(pb.project)} — ${pb.tasks} quest${pb.tasks===1?"":"s"}</li>`).join("")}
              </ul>
            </div>` : ""}
          </div>
          <div class="summary-divider"></div>` : ""}
          <ul>
            ${eventLog.map(e => `<li class="log-${e.type}">${e.type==="downed"?ic("skull",14):e.type==="shield"?ic("shieldalert",14):""} ${e.text}</li>`).join("")}
          </ul>
          <button class="btn btn-close" id="btn-close-log">Continue</button>
        </div>
      </div>` : ""}

      ${showSettings ? `
      <div class="log-overlay" id="settings-overlay">
        <div class="log-card" onclick="event.stopPropagation()">
          <h3>${ic("gear",16)} Settings</h3>
          <div class="settings-section">
            <div class="settings-label">Automatic End Day</div>
            <p class="settings-desc">When on, any weekday night that passes while the app is closed is applied automatically the next time you open it — no need to remember End Day. Quests you check off the next morning count for that morning, so the night before still sees them as open.</p>
            <label class="hide-completed"><input type="checkbox" id="auto-endday-checkbox" ${state.settings.autoEndDay !== false ? "checked" : ""}> Apply missed nights automatically</label>
          </div>
          <div class="settings-section">
            <div class="settings-label">Difficulty</div>
            <p class="settings-desc">Sets your base starting HP (before level bonuses). Changing this recalculates your current max HP right away.</p>
            <div class="settings-options">
              ${Object.entries(DIFFICULTY_BASE_HP).map(([key, hp]) => `
                <button class="settings-option-btn ${state.settings.difficulty===key?"settings-option-active":""}" data-set-difficulty="${key}">
                  <span class="settings-option-name">${key.charAt(0).toUpperCase()+key.slice(1)}</span>
                  <span class="settings-option-sub">${hp} base HP</span>
                </button>
              `).join("")}
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-label">Rest Days</div>
            <p class="settings-desc">Mark today as a holiday or vacation day — skips tonight's overdue damage entirely. Tasks left incomplete are still overdue afterward, so this buys you the day off without erasing what's due. Capped per year so it's there for real time off, not every day.</p>
            ${(() => {
              const today = todayStr();
              const isToday = state.restDays.includes(today);
              const used = restDaysUsedThisYear();
              const remaining = Math.max(0, REST_DAYS_PER_YEAR - used);
              return `<button class="settings-option-btn ${isToday?"settings-option-active":""}" id="btn-mark-rest-day" style="width:100%" ${isToday || remaining<=0 ? "disabled" : ""}>
                <span class="settings-option-name">${isToday ? "Today is a Rest Day" : "Take Today Off"}</span>
                <span class="settings-option-sub">${remaining} of ${REST_DAYS_PER_YEAR} left this year</span>
              </button>`;
            })()}
          </div>
          <button class="btn btn-close" id="btn-close-settings">Close</button>
        </div>
      </div>` : ""}

      <section class="panel backup-panel">
        <div class="panel-head"><h2>Backup</h2><span class="panel-sub">Save your progress to a file, or restore from one</span></div>
        <div class="backup-row">
          <button class="btn btn-backup" id="btn-export">${ic("trophy",14)} Export save file</button>
          <button class="btn btn-backup-alt" id="btn-import-trigger">Import save file</button>
          <input type="file" id="input-import" accept="application/json" style="display:none">
        </div>
        ${importMsg ? `<div class="import-msg ${importMsg.ok?'ok':'err'}">${escapeHtml(importMsg.text)}</div>` : ""}
      </section>
      ${syncPanelHtml()}

      <footer class="footer">
        ${!confirmReset
          ? `<button class="link-btn subtle" id="btn-reset-ask">Start a new game</button>`
          : `<span class="reset-confirm">Erase all progress? <button class="link-btn" id="btn-reset-yes">Yes, reset</button> · <button class="link-btn" id="btn-reset-no">Cancel</button></span>`}
      </footer>

      <div class="toast-stack">
        ${toasts.map(t => `<div class="toast"><span>${t.text}</span><button class="toast-close" data-toast-close="${t.id}">✕</button></div>`).join("")}
      </div>
    </div>
  `;

  attachHandlers();
}



function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function attachHandlers() {
  const $ = (sel) => document.querySelector(sel);
  const titleInput = $("#input-title");
  if (titleInput) {
    titleInput.addEventListener("input", (e) => { formTitle = e.target.value; });
    titleInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });
  }
  const dateInput = $("#input-date");
  if (dateInput) dateInput.addEventListener("input", (e) => { formDue = e.target.value; });
  const tierInput = $("#input-tier");
  if (tierInput) tierInput.addEventListener("change", (e) => { formTier = e.target.value; });
  const projectInput = $("#input-project");
  if (projectInput) projectInput.addEventListener("input", (e) => { formProject = e.target.value; });

  const goalProjectInput = $("#input-goal-project");
  if (goalProjectInput) goalProjectInput.addEventListener("change", (e) => { formGoalProject = e.target.value; });
  const goalMetricInput = $("#input-goal-metric");
  if (goalMetricInput) goalMetricInput.addEventListener("change", (e) => { formGoalMetric = e.target.value; });
  const goalTargetInput = $("#input-goal-target");
  if (goalTargetInput) goalTargetInput.addEventListener("input", (e) => { formGoalTarget = e.target.value; });
  const goalPeriodInput = $("#input-goal-period");
  if (goalPeriodInput) goalPeriodInput.addEventListener("input", (e) => { formGoalPeriod = e.target.value; });
  const addGoalBtn = $("#btn-add-goal"); if (addGoalBtn) addGoalBtn.addEventListener("click", addGoal);
  document.querySelectorAll("[data-remove-goal]").forEach(btn => btn.addEventListener("click", () => removeGoal(btn.dataset.removeGoal)));

  document.querySelectorAll("[data-toggle-menu]").forEach(btn => btn.addEventListener("click", () => toggleTaskMenu(btn.dataset.toggleMenu)));
  document.querySelectorAll("[data-menu-recur]").forEach(btn => btn.addEventListener("click", () => openRecurEditor(btn.dataset.menuRecur)));
  document.querySelectorAll("[data-menu-tier]").forEach(btn => btn.addEventListener("click", () => openTierEditor(btn.dataset.menuTier)));
  document.querySelectorAll("[data-menu-title]").forEach(btn => btn.addEventListener("click", () => openTitleEditor(btn.dataset.menuTitle)));
  document.querySelectorAll("[data-menu-due]").forEach(btn => btn.addEventListener("click", () => openDueEditor(btn.dataset.menuDue)));
  document.querySelectorAll("[data-title-save]").forEach(btn => btn.addEventListener("click", () => {
    const el = document.getElementById("title-edit-" + btn.dataset.titleSave);
    renameTask(btn.dataset.titleSave, el ? el.value : "");
  }));
  document.querySelectorAll("[data-title-edit]").forEach(el => el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") renameTask(el.dataset.titleEdit, el.value);
    else if (e.key === "Escape") closeTaskEditors();
  }));
  document.querySelectorAll("[data-resched-confirm]").forEach(btn => btn.addEventListener("click", () => {
    const el = document.getElementById("resched-date-" + btn.dataset.reschedConfirm);
    rescheduleTask(btn.dataset.reschedConfirm, el ? el.value : "");
  }));
  document.querySelectorAll("[data-menu-project]").forEach(btn => btn.addEventListener("click", () => startEditProject(btn.dataset.menuProject)));
  document.querySelectorAll("[data-cancel-edit]").forEach(btn => btn.addEventListener("click", closeTaskEditors));
  document.querySelectorAll("[data-set-tier]").forEach(btn => btn.addEventListener("click", () => updateTaskTier(btn.dataset.setTier, btn.dataset.tierValue)));
  document.querySelectorAll("[data-set-recur]").forEach(btn => btn.addEventListener("click", () => {
    const type = btn.dataset.recurType;
    setTaskRecurring(btn.dataset.setRecur, type === "__clear__" ? null : type);
  }));
  document.querySelectorAll("[data-set-recur-custom]").forEach(btn => btn.addEventListener("click", () => {
    const taskId = btn.dataset.setRecurCustom;
    const input = document.getElementById(`recur-days-${taskId}`);
    setTaskRecurring(taskId, "custom", input ? input.value : 2);
  }));

  document.querySelectorAll("[data-stats-view]").forEach(btn => btn.addEventListener("click", () => setStatsView(btn.dataset.statsView)));
  document.querySelectorAll("[data-page]").forEach(btn => btn.addEventListener("click", () => setPage(btn.dataset.page)));

  const filterToggleBtn = $("#btn-filter-toggle");
  if (filterToggleBtn) filterToggleBtn.addEventListener("click", toggleQuestFilterOpen);
  const filterClearBtn = $("#btn-filter-clear");
  if (filterClearBtn) filterClearBtn.addEventListener("click", clearQuestFilters);
  document.querySelectorAll("[data-filter-checkbox]").forEach(cb => cb.addEventListener("change", () => toggleQuestFilterProject(cb.dataset.filterCheckbox)));
  const hideCompletedBox = $("#hide-completed-checkbox");
  if (hideCompletedBox) hideCompletedBox.addEventListener("change", toggleHideCompleted);

  document.querySelectorAll("[data-edit-project]").forEach(btn => btn.addEventListener("click", () => startEditProject(btn.dataset.editProject)));
  document.querySelectorAll("[data-project-edit]").forEach(input => {
    input.addEventListener("blur", (e) => commitEditProject(input.dataset.projectEdit, e.target.value));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") e.target.blur();
      if (e.key === "Escape") { editingProjectTaskId = null; render(); }
    });
  });
  if (editingProjectTaskId) {
    const el = document.getElementById(`project-edit-${editingProjectTaskId}`);
    if (el) { el.focus(); el.select(); }
  }

  const addBtn = $("#btn-add"); if (addBtn) addBtn.addEventListener("click", addTask);
  const autoEndBox = $("#auto-endday-checkbox"); if (autoEndBox) autoEndBox.addEventListener("change", toggleAutoEndDay);
  const endDayBtn = $("#btn-endday"); if (endDayBtn) endDayBtn.addEventListener("click", () => endDay(false));
  const forceBtn = $("#btn-force-endday"); if (forceBtn) forceBtn.addEventListener("click", () => endDay(true));
  const closeLogBtn = $("#btn-close-log"); if (closeLogBtn) closeLogBtn.addEventListener("click", () => { showLog = false; render(); });
  const openSettingsBtn = $("#btn-open-settings"); if (openSettingsBtn) openSettingsBtn.addEventListener("click", () => { showSettings = true; render(); });
  const toggleForecastBtn = $("#btn-toggle-forecast-detail"); if (toggleForecastBtn) toggleForecastBtn.addEventListener("click", () => { showForecastDetail = !showForecastDetail; render(); });
  const closeSettingsBtn = $("#btn-close-settings"); if (closeSettingsBtn) closeSettingsBtn.addEventListener("click", () => { showSettings = false; render(); });
  document.querySelectorAll("[data-set-difficulty]").forEach(btn => btn.addEventListener("click", () => setDifficulty(btn.dataset.setDifficulty)));
  document.querySelectorAll("[data-choose-class]").forEach(btn => btn.addEventListener("click", () => chooseClass(btn.dataset.chooseClass, btn.dataset.chooseAbility)));
  document.querySelectorAll("[data-cast-ability]").forEach(btn => btn.addEventListener("click", () => {
    const fn = ABILITY_CAST_FN[btn.dataset.castAbility];
    if (fn) fn();
  }));
  document.querySelectorAll("[data-tame-companion]").forEach(btn => btn.addEventListener("click", () => tameCompanion(btn.dataset.tameCompanion)));
  document.querySelectorAll("[data-set-companion]").forEach(btn => btn.addEventListener("click", () => setActiveCompanion(btn.dataset.setCompanion)));
  const markRestDayBtn = $("#btn-mark-rest-day"); if (markRestDayBtn) markRestDayBtn.addEventListener("click", markTodayAsRestDay);
  const overlay = $("#log-overlay"); if (overlay) overlay.addEventListener("click", () => { showLog = false; render(); });
  const settingsOverlay = $("#settings-overlay"); if (settingsOverlay) settingsOverlay.addEventListener("click", () => { showSettings = false; render(); });
  const resetAsk = $("#btn-reset-ask"); if (resetAsk) resetAsk.addEventListener("click", () => { confirmReset = true; render(); });
  const resetYes = $("#btn-reset-yes"); if (resetYes) resetYes.addEventListener("click", resetGame);
  const resetNo = $("#btn-reset-no"); if (resetNo) resetNo.addEventListener("click", () => { confirmReset = false; render(); });

  const syncConnectBtn = $("#btn-sync-connect"); if (syncConnectBtn) syncConnectBtn.addEventListener("click", () => connectSync($("#input-sync-token").value, $("#input-sync-gist").value));
  const syncNowBtn = $("#btn-sync-now"); if (syncNowBtn) syncNowBtn.addEventListener("click", () => syncNow("manual"));
  const syncDisBtn = $("#btn-sync-disconnect"); if (syncDisBtn) syncDisBtn.addEventListener("click", disconnectSync);
  const exportBtn = $("#btn-export"); if (exportBtn) exportBtn.addEventListener("click", exportSave);
  const importTrigger = $("#btn-import-trigger"); if (importTrigger) importTrigger.addEventListener("click", () => $("#input-import").click());
  const importInput = $("#input-import");
  if (importInput) importInput.addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) importSave(e.target.files[0]);
  });

  document.querySelectorAll("[data-complete]").forEach(btn => btn.addEventListener("click", () => completeTask(btn.dataset.complete)));
  document.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", () => removeTask(btn.dataset.remove)));
  document.querySelectorAll("[data-shield]").forEach(btn => btn.addEventListener("click", () => shieldTask(btn.dataset.shield)));
  document.querySelectorAll("[data-toggle-flag]").forEach(btn => btn.addEventListener("click", () => toggleTaskFlag(btn.dataset.toggleFlag)));
  document.querySelectorAll("[data-contrib-date]").forEach(cell => cell.addEventListener("click", () => {
    selectedContribDate = selectedContribDate === cell.dataset.contribDate ? null : cell.dataset.contribDate;
    render();
  }));
  const contribCloseBtn = $("#btn-contrib-close"); if (contribCloseBtn) contribCloseBtn.addEventListener("click", () => { selectedContribDate = null; render(); });
  document.querySelectorAll("[data-select-year]").forEach(btn => btn.addEventListener("click", () => {
    selectedContribYear = parseInt(btn.dataset.selectYear, 10);
    selectedContribDate = null;
    render();
  }));
  const innRestBtn = $("#btn-inn-rest"); if (innRestBtn) innRestBtn.addEventListener("click", restAtInn);
  const customQuestTitleInput = $("#input-custom-quest-title");
  if (customQuestTitleInput) customQuestTitleInput.addEventListener("input", (e) => { formCustomQuestTitle = e.target.value; });
  const customQuestGoldInput = $("#input-custom-quest-gold");
  if (customQuestGoldInput) customQuestGoldInput.addEventListener("input", (e) => { formCustomQuestGold = e.target.value; });
  const customQuestRepInput = $("#input-custom-quest-rep");
  if (customQuestRepInput) customQuestRepInput.addEventListener("input", (e) => { formCustomQuestRep = e.target.value; });
  const addHabitBtn = $("#btn-add-habit"); if (addHabitBtn) addHabitBtn.addEventListener("click", () => addHabit($("#input-habit-name").value, $("#select-habit-sev").value));
  const habitNameInput = $("#input-habit-name"); if (habitNameInput) habitNameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addHabit(habitNameInput.value, $("#select-habit-sev").value); });
  document.querySelectorAll("[data-log-slip]").forEach(btn => btn.addEventListener("click", () => logSlip(btn.dataset.logSlip)));
  document.querySelectorAll("[data-undo-slip]").forEach(btn => btn.addEventListener("click", () => undoSlip(btn.dataset.undoSlip)));
  document.querySelectorAll("[data-remove-habit]").forEach(btn => btn.addEventListener("click", () => removeHabit(btn.dataset.removeHabit)));
  const addCustomQuestBtn = $("#btn-add-custom-quest"); if (addCustomQuestBtn) addCustomQuestBtn.addEventListener("click", addCustomQuest);
  document.querySelectorAll("[data-submit-custom-quest]").forEach(btn => btn.addEventListener("click", () => submitCustomQuest(btn.dataset.submitCustomQuest)));
  document.querySelectorAll("[data-remove-custom-quest]").forEach(btn => btn.addEventListener("click", () => removeCustomQuest(btn.dataset.removeCustomQuest)));
  document.querySelectorAll("[data-use]").forEach(btn => btn.addEventListener("click", () => useItem(btn.dataset.use)));
  document.querySelectorAll("[data-toast-close]").forEach(btn => btn.addEventListener("click", () => dismissToast(btn.dataset.toastClose)));

  const newWeekBtn = $("#btn-newweek"); if (newWeekBtn) newWeekBtn.addEventListener("click", newWeek);

  document.querySelectorAll("[data-choose-enemy]").forEach(btn => btn.addEventListener("click", () => chooseEnemy(btn.dataset.chooseEnemy)));

  const stayBtn = $("#btn-choice-stay"); if (stayBtn) stayBtn.addEventListener("click", chooseStay);
  const townBtn = $("#btn-choice-town"); if (townBtn) townBtn.addEventListener("click", chooseTown);
  const leaveTownBtn = $("#btn-leave-town"); if (leaveTownBtn) leaveTownBtn.addEventListener("click", leaveTown);
  document.querySelectorAll("[data-buy]").forEach(btn => btn.addEventListener("click", () => buyItem(btn.dataset.buy)));
  document.querySelectorAll("[data-sell]").forEach(btn => btn.addEventListener("click", () => sellItem(btn.dataset.sell)));
  document.querySelectorAll("[data-fast-travel]").forEach(btn => btn.addEventListener("click", () => fastTravel(parseInt(btn.dataset.fastTravel, 10))));
  document.querySelectorAll("[data-turnin]").forEach(btn => btn.addEventListener("click", () => turnInBulletinQuest(btn.dataset.turnin)));
  document.querySelectorAll("[data-craft]").forEach(btn => btn.addEventListener("click", () => craftItem(btn.dataset.craft)));
  document.querySelectorAll("[data-equip]").forEach(btn => btn.addEventListener("click", () => equipItem(btn.dataset.equip)));
  document.querySelectorAll("[data-unequip]").forEach(btn => btn.addEventListener("click", () => unequipItem(btn.dataset.unequip)));
  const askRetreatBtn = $("#btn-ask-retreat"); if (askRetreatBtn) askRetreatBtn.addEventListener("click", () => { confirmRetreat = true; render(); });
  const confirmRetreatBtn = $("#btn-confirm-retreat"); if (confirmRetreatBtn) confirmRetreatBtn.addEventListener("click", retreatToTown);
  const cancelRetreatBtn = $("#btn-cancel-retreat"); if (cancelRetreatBtn) cancelRetreatBtn.addEventListener("click", () => { confirmRetreat = false; render(); });
  document.querySelectorAll("[data-choice-move]").forEach(btn => btn.addEventListener("click", () => chooseMove(btn.dataset.choiceMove)));
}

if (syncCfg.token) {
  // Pull first so a night already resolved on another device isn't resolved twice.
  render();
  Promise.race([syncNow("startup"), new Promise(r => setTimeout(r, 8000))]).then(() => { autoResolveMissedNights(); render(); });
} else {
  autoResolveMissedNights();
  render();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (syncCfg.token && syncCfg.dirty) syncNow(); return; }
  if (syncCfg.token) syncNow("resume").then(checkForNewDay); else checkForNewDay();
});
setInterval(checkForNewDay, 60 * 1000);

document.addEventListener("click", (e) => {
  if (questFilterOpen && !e.target.closest(".filter-dropdown")) {
    questFilterOpen = false;
    render();
  }
});
</script>
</body>
</html>
